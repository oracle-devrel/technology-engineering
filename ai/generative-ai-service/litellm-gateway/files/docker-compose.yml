services:
  gateway:
    build: .
    ports:
      - "4000:4000"
    env_file: .env
    volumes:
      # Live-reloadable config + guardrails (override what the image copied)
      - ./config:/app/config
      - ./guardrails:/app/guardrails
      # OCI API signing key for the on-demand models + guardrails calls
      - ${OCI_KEY_FILE_HOST:-~/.oci/oci_api_key.pem}:/keys/oci_api_key.pem:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmproxy}
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  litellm_pgdata:
