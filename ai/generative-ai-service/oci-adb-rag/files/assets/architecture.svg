<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OCI enterprise RAG architecture</title>
  <desc id="desc">A central Autonomous AI Database architecture with document ingestion and grounded chat services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcfcf9"/><stop offset="1" stop-color="#edf8e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#143f38" flood-opacity=".09"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#4f8c70"/></marker>
    <style>.sans{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.eyebrow{font:700 14px Arial;letter-spacing:2px;fill:#68837d}.title{font:700 44px Georgia;fill:#143f38}.sub{font:17px Arial;fill:#58716b}.zone{font:700 13px Arial;letter-spacing:2px;fill:#66817b}.node{font:700 17px Arial;fill:#143f38}.detail{font:14px Arial;fill:#5c746e}.mini{font:700 11px Arial;letter-spacing:1.3px;fill:#51816c}.label{font:700 11px Arial;fill:#57826f}</style>
