  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1490" cy="95" r="220" fill="#e0f3d6" opacity=".58"/>
  <text x="70" y="76" class="eyebrow">ENTERPRISE RAG ON OCI</text><text x="70" y="130" class="title">One data foundation. <tspan fill="#4f9b79" font-style="italic">Trusted answers.</tspan></text><text x="70" y="165" class="sub">langchain-oracle brings OCI Generative AI and native vector search together in Autonomous AI Database.</text>
