# =============================================================================
# Namespace: enterprise-chat-app
# =============================================================================
# Provides resource isolation for the OCI Enterprise Chat Application.
# All application workloads, services, secrets, and configmaps reside here.
#
# Apply with:
#   kubectl apply -f namespace.yml
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: enterprise-chat-app
  labels:
    app.kubernetes.io/part-of: enterprise-chat-app
    app.kubernetes.io/managed-by: kubectl
