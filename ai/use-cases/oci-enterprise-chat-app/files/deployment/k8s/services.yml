# -----------------------------------------------------------------------------
# Services for OCI Enterprise Chat Application
# Namespace: enterprise-chat-app
# Cluster: Oracle Kubernetes Engine (OKE)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: enterprise-chat-app
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
# Frontend Service — ClusterIP (exposed externally via Ingress)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: enterprise-chat-app
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
