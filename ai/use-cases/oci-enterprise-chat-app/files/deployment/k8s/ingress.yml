# -----------------------------------------------------------------------------
# OPTIONAL: NGINX Ingress for OCI Enterprise Chat Application
#
# This is an ALTERNATIVE to the LoadBalancer service defined in services.yml.
# Use this if you prefer a single ingress point with path-based routing
# instead of exposing the frontend directly via an OCI Load Balancer service.
#
# Prerequisites:
#   - NGINX Ingress Controller must be installed in the cluster.
#   - If using OCI Load Balancer for the ingress controller service,
#     the flexible shape annotations below configure its bandwidth range.
#
# Do NOT use both the LoadBalancer service (frontend-service type: LoadBalancer)
# and this Ingress simultaneously for the same frontend, as it will create
# duplicate load balancers and conflicting routing.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-chat-ingress
  namespace: enterprise-chat-app
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Backend API routes — Prefix match ensures sub-paths are forwarded
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Frontend catch-all — must be listed last so API routes match first
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
