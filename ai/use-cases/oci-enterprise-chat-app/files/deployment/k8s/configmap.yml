# =============================================================================
# ConfigMaps for OCI Enterprise Chat Application
# =============================================================================
# Non-sensitive configuration for backend and frontend services.
#
# Apply with:
#   kubectl apply -f configmap.yml -n enterprise-chat-app
# =============================================================================

# -----------------------------------------------------------------------------
# ConfigMap: backend-config
# FastAPI backend application configuration
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: enterprise-chat-app
  labels:
    app.kubernetes.io/part-of: enterprise-chat-app
    app.kubernetes.io/component: backend
data:
  # Server configuration
  HOST: "0.0.0.0"
  PORT: "8000"
  RELOAD: "false"
  LOG_LEVEL: "INFO"

  # File upload directory (relative to /app inside the container)
  UPLOAD_DIR: "uploads"

  # CORS — allow requests from the frontend service within the cluster
  CORS_ORIGINS: "http://150.230.144.100,http://frontend-service.enterprise-chat-app.svc.cluster.local"

  # Oracle Autonomous Database connection
  ORACLE_DB_USERNAME: "ADMIN"
  ORACLE_DSN: "aiacceloracle26aiahxcfp_high"
  ORACLE_WALLET_DIR: "/app/config/wallet"

  # Vector store configuration
  ORACLE_VECTOR_TABLE: "document_vectors"
  ORACLE_EMBEDDING_DIMENSION: "1024"

  # AI model configuration
  EMBEDDING_MODEL: "oci/cohere.embed-multilingual-v3.0"
  RAG_MODEL: "oci/meta.llama-4-maverick-17b-128e-instruct-fp8"

  # Parallelism for batch embedding / ingestion operations
  MAX_BATCH_PARALLELISM: "5"

---
# -----------------------------------------------------------------------------
# ConfigMap: frontend-config
# React (Vite) frontend configuration
# -----------------------------------------------------------------------------
# NOTE: VITE_API_URL uses the in-cluster service name so the frontend's
# runtime proxy or server-side calls can reach the backend. For client-side
# (browser) requests, the Ingress or gateway layer handles routing.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: enterprise-chat-app
  labels:
    app.kubernetes.io/part-of: enterprise-chat-app
    app.kubernetes.io/component: frontend
data:
  VITE_API_URL: "http://backend-service:8000"
