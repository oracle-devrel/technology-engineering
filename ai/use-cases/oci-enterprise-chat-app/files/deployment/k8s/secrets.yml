# =============================================================================
# Secrets for OCI Enterprise Chat Application
# =============================================================================
#
# WARNING: This file contains PLACEHOLDER values only.
#          You MUST replace all placeholder values before deploying.
#          NEVER commit real credentials to version control.
#
# Recommended workflow:
#   1. Copy this file to a location outside version control
#   2. Replace all placeholder values with real base64-encoded secrets
#   3. Apply directly:  kubectl apply -f secrets.yml
#   4. Delete the local copy with real values
#
# To base64-encode a value:
#   echo -n 'your-secret-value' | base64
#
# =============================================================================

# -----------------------------------------------------------------------------
# Secret: backend-secrets
# Backend application secrets (database password, RAG endpoint)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: enterprise-chat-app
  labels:
    app.kubernetes.io/part-of: enterprise-chat-app
    app.kubernetes.io/component: backend
type: Opaque
data:
  # REPLACE: Base64-encoded Oracle Autonomous Database password
  # Generate with: echo -n 'your-db-password' | base64
  ORACLE_DB_PASSWORD: "Y2hhbmdlLW1l"

  # REPLACE: Base64-encoded RAG inference endpoint URL
  # Generate with: echo -n 'https://inference.generativeai.us-chicago-1.oci.oraclecloud.com' | base64
  RAG_ENDPOINT_URL: "aHR0cHM6Ly9leGFtcGxlLmNvbQ=="

  # Frontend admin login credentials (read by backend/routers/auth.py)
  # Generate with: echo -n 'your-admin-username' | base64
  ADMIN_USERNAME: "YWRtaW4="
  # Generate with: echo -n 'your-admin-password' | base64
  ADMIN_PASSWORD: "Y2hhbmdlLW1l"

---
# -----------------------------------------------------------------------------
# Secret: ocir-credentials
# OCI Container Registry (OCIR) pull credentials
# -----------------------------------------------------------------------------
# This secret allows Kubernetes to pull container images from OCIR.
#
# Preferred method — create via kubectl (avoids manual base64 encoding):
#   kubectl create secret docker-registry ocir-credentials \
#     --docker-server=<region>.ocir.io \
#     --docker-username='<object-storage-namespace>/<oci-username>' \
#     --docker-password='<auth-token>' \
#     --docker-email='<email>' \
#     -n enterprise-chat-app
#
# For the current cluster region (us-chicago-1), the registry server is:
#   us-chicago-1.ocir.io
# -----------------------------------------------------------------------------
# apiVersion: v1
# kind: Secret
# metadata:
#   name: ocir-credentials
#   namespace: enterprise-chat-app
#   labels:
#     app.kubernetes.io/part-of: enterprise-chat-app
#     app.kubernetes.io/component: registry
# type: kubernetes.io/dockerconfigjson
# data:
#   # REPLACE: Base64-encoded Docker config JSON
#   # Generate with:
#   #   kubectl create secret docker-registry ocir-credentials \
#   #     --docker-server=us-chicago-1.ocir.io \
#   #     --docker-username='iduyx1qnmway/<your-oci-username>' \
#   #     --docker-password='<your-auth-token>' \
#   #     --docker-email='<your-email>' \
#   #     -n enterprise-chat-app --dry-run=client -o jsonpath='{.data.\.dockerconfigjson}'
#   .dockerconfigjson: "CHANGEME_BASE64_ENCODED_DOCKER_CONFIG_JSON"

---
# -----------------------------------------------------------------------------
# Secret: oracle-wallet
# Oracle Autonomous Database wallet files for mTLS connections
# -----------------------------------------------------------------------------
# The wallet contains certificates and connection descriptors required for
# secure connectivity to Oracle Autonomous Database.
#
# DO NOT manually encode wallet files. Create this secret directly from the
# wallet directory:
#
#   kubectl create secret generic oracle-wallet \
#     --from-file=backend/config/wallet/ \
#     -n enterprise-chat-app
#
# This will create keys for each file in the wallet directory:
#   - cwallet.sso       (auto-login SSO wallet)
#   - ewallet.p12       (PKCS#12 wallet)
#   - ewallet.pem       (PEM-encoded wallet)
#   - keystore.jks       (Java keystore)
#   - ojdbc.properties   (JDBC properties)
#   - sqlnet.ora         (SQL*Net configuration)
#   - tnsnames.ora       (TNS connection descriptors)
#   - truststore.jks     (Java truststore)
#
# The wallet directory is mounted into the backend pod at /app/config/wallet
# via the backend deployment volume mount.
# -----------------------------------------------------------------------------
# apiVersion: v1
# kind: Secret
# metadata:
#   name: oracle-wallet
#   namespace: enterprise-chat-app
#   labels:
#     app.kubernetes.io/part-of: enterprise-chat-app
#     app.kubernetes.io/component: backend
# type: Opaque
# data:
#   # PLACEHOLDER — use kubectl create secret generic (see above) instead
#   # of manually populating these fields.
#   cwallet.sso: "CHANGEME_USE_KUBECTL_CREATE_SECRET"
#   ewallet.p12: "CHANGEME_USE_KUBECTL_CREATE_SECRET"
#   ewallet.pem: "CHANGEME_USE_KUBECTL_CREATE_SECRET"
#   keystore.jks: "CHANGEME_USE_KUBECTL_CREATE_SECRET"
#   ojdbc.properties: "CHANGEME_USE_KUBECTL_CREATE_SECRET"
#   sqlnet.ora: "CHANGEME_USE_KUBECTL_CREATE_SECRET"
#   tnsnames.ora: "CHANGEME_USE_KUBECTL_CREATE_SECRET"
#   truststore.jks: "CHANGEME_USE_KUBECTL_CREATE_SECRET"
