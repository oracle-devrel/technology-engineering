apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "enterprise-chat-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
data:
  ORACLE_DB_PASSWORD: {{ .Values.backend.secrets.oracleDbPassword | quote }}
  RAG_ENDPOINT_URL: {{ .Values.backend.secrets.ragEndpointUrl | quote }}
  ADMIN_USERNAME: {{ .Values.backend.secrets.adminUsername | quote }}
  ADMIN_PASSWORD: {{ .Values.backend.secrets.adminPassword | quote }}
