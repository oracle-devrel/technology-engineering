        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.frontend.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.frontend.autoscaling.scaleUp.stabilizationWindowSeconds }}
      policies:
        - type: Pods
