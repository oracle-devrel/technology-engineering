# Template only. Generate a kubeconfig locally with the OCI CLI; never commit a live one.
apiVersion: v1
kind: Config
clusters:
  - name: <OCI_CLUSTER_NAME>
    cluster:
      server: https://<OCI_CLUSTER_API_ENDPOINT>:6443
      certificate-authority-data: <BASE64_CLUSTER_CA_CERTIFICATE>
users:
  - name: <OCI_USER_NAME>
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: oci
        args:
          - ce
          - cluster
          - generate-token
          - --cluster-id
          - <OCI_CLUSTER_OCID>
          - --region
          - <OCI_REGION>
contexts:
  - name: <OCI_CONTEXT_NAME>
    context:
      cluster: <OCI_CLUSTER_NAME>
      user: <OCI_USER_NAME>
current-context: <OCI_CONTEXT_NAME>
