# ------------------------------------------------------------------
# nginx.conf — production configuration for the React SPA frontend
#
# Responsibilities:
#   1. Serve the Vite-built static assets from /usr/share/nginx/html
#   2. Reverse-proxy API paths to the backend FastAPI service
#   3. Handle SPA client-side routing (fallback to index.html)
#   4. Apply gzip compression and cache-control headers
# ------------------------------------------------------------------

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging ------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ---- Performance --------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ---- Gzip compression ---------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---- Upstreams -------------------------------------------------
    # Authentication is intentionally served by this app's backend, which
    # reads its credentials from a server-side secret. Do not move it into the
    # frontend bundle or proxy it to the external service.
    upstream local_auth_backend {
        server backend-service:8000;
    }

    # OCI EnterpriseAI Chat backend
    # This is the deployed AI-Q Enterprise Search service. It owns
    # authentication, document ingestion, OCI GenAI inference, and Oracle
    # 26ai vector retrieval; the local frontend only talks to it through this
    # same-origin reverse proxy.
    upstream enterprise_ai_backend {
        server aiq-rb.163-192-63-55.nip.io:443;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ---- Security headers -----------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- Proxy: API routes ----------------------------------
        # Keep the authentication boundary local so credentials remain
        # server-side. The remaining capabilities use EnterpriseAI.
        location /api/auth {
            proxy_pass http://local_auth_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Workflow definitions, schedules and batch jobs belong to this app.
        location /api/workflows {
            proxy_pass http://local_auth_backend;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }
        location /api/batch {
            proxy_pass http://local_auth_backend;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }

        # Other API requests use the deployed EnterpriseAI
        # service and its OCI GenAI / Oracle 26ai knowledge backend.
        location /api {
            proxy_pass https://enterprise_ai_backend;
            proxy_ssl_server_name on;
            proxy_ssl_name aiq-rb.163-192-63-55.nip.io;
            proxy_set_header Host              aiq-rb.163-192-63-55.nip.io;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts tuned for long-running LLM inference calls
            proxy_connect_timeout 60s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            # Support streaming responses (SSE / chunked transfer)
            proxy_buffering off;
            proxy_cache off;
        }

        # ---- Proxy: FastAPI docs & health check -----------------
        location /docs {
            proxy_pass https://enterprise_ai_backend;
            proxy_ssl_server_name on;
            proxy_ssl_name aiq-rb.163-192-63-55.nip.io;
            proxy_set_header Host              aiq-rb.163-192-63-55.nip.io;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass https://enterprise_ai_backend;
            proxy_ssl_server_name on;
            proxy_ssl_name aiq-rb.163-192-63-55.nip.io;
            proxy_set_header Host              aiq-rb.163-192-63-55.nip.io;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass https://enterprise_ai_backend;
            proxy_ssl_server_name on;
            proxy_ssl_name aiq-rb.163-192-63-55.nip.io;
            proxy_set_header Host              aiq-rb.163-192-63-55.nip.io;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass https://enterprise_ai_backend;
            proxy_ssl_server_name on;
            proxy_ssl_name aiq-rb.163-192-63-55.nip.io;
            proxy_set_header Host              aiq-rb.163-192-63-55.nip.io;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Static assets: long-lived cache --------------------
        # Vite fingerprints JS/CSS filenames (e.g. index-abc123.js),
        # so they are safe to cache aggressively.
        location /assets {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---- Static files: favicon, logos, etc. -----------------
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # ---- SPA fallback: client-side routing ------------------
        # Any route that does not match a static file or a proxied
        # path falls through to index.html so React Router can
        # handle it.
        location / {
            try_files $uri $uri/ /index.html;

            # index.html itself must never be cached — it references
            # the fingerprinted asset URLs that change on each deploy.
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }
    }
}
