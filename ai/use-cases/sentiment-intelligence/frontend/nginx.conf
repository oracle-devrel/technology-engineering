server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service inside the cluster. The trailing
    # /api/ path is preserved so FastAPI routes (e.g. /api/health) resolve.
    location /api/ {
        proxy_pass http://backend-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events used by /api/analyze need buffering disabled and a
        # long read timeout so progress streams through in real time.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
