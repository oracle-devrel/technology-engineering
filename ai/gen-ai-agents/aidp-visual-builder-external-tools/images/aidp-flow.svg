<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
<title id="title">AIDP visual agent and external tools</title><desc id="desc">A chat trigger starts one agent that can call structured data, document search, an API or MCP service, and a custom tool.</desc>
<defs><style>.bg{fill:#f7f8fa}.box{fill:white;stroke:#304861;stroke-width:2;rx:16}.teal{fill:#e6f3ef;stroke:#287c69}.blue{fill:#edf2ff;stroke:#4457a5}.gold{fill:#fff5e8;stroke:#b35b00}.t{font:700 22px Arial;fill:#1e324b}.s{font:16px Arial;fill:#43566d}.small{font:14px Arial;fill:#64748b}.line{stroke:#52647a;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#52647a"/></marker></defs>
<rect class="bg" width="1100" height="480"/><text class="t" x="550" y="45" text-anchor="middle" font-size="28">One AIDP agent, the tools the task needs</text>
<rect class="box blue" x="420" y="78" width="260" height="72"/><text class="t" x="550" y="122" text-anchor="middle">Chat Trigger</text>
<rect class="box gold" x="390" y="190" width="320" height="94"/><text class="t" x="550" y="228" text-anchor="middle">AIDP Agent</text><text class="s" x="550" y="257" text-anchor="middle">chooses tools and explains results</text>
<rect class="box teal" x="30" y="350" width="235" height="82"/><text class="t" x="147" y="383" text-anchor="middle">SQL / Select AI</text><text class="small" x="147" y="410" text-anchor="middle">table data</text>
<rect class="box blue" x="300" y="350" width="235" height="82"/><text class="t" x="417" y="383" text-anchor="middle">RAG / Vector Search</text><text class="small" x="417" y="410" text-anchor="middle">approved files</text>
<rect class="box teal" x="570" y="350" width="235" height="82"/><text class="t" x="687" y="383" text-anchor="middle">HTTP / Remote MCP</text><text class="small" x="687" y="410" text-anchor="middle">existing services</text>
<rect class="box blue" x="840" y="350" width="235" height="82"/><text class="t" x="957" y="383" text-anchor="middle">Custom Tool</text><text class="small" x="957" y="410" text-anchor="middle">small Python action</text>
<path class="line" d="M550 150V185"/><path class="line" d="M480 284C400 315 190 305 150 345"/><path class="line" d="M520 284C485 315 440 315 420 345"/><path class="line" d="M580 284C615 315 660 315 680 345"/><path class="line" d="M620 284C700 315 910 305 950 345"/>
<text class="small" x="550" y="465" text-anchor="middle">Use one agent first; add a supervisor when it needs to route between specialist agents.</text></svg>