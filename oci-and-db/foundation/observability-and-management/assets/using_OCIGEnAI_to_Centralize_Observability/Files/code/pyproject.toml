[project]
name = "oci-db-assistant"
version = "0.2.0"
description = "An OCI Generative AI observability assistant with an authorized MCP gateway"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.159.1", "uvicorn==0.54.0", "authlib==1.9.1",
  "itsdangerous==2.2.0", "httpx==0.28.1", "oci==2.189.0",
  "mcp==1.30.0", "jsonschema==4.26.0", "PyYAML==6.0.3", "cryptography==50.0.2", "httpcore==1.0.9",
  "pydantic==2.14.1", "starlette==1.9.0",
  "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1"
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["assistant"]
