{% macro pr_plan_actions(pr_number, project, pr_url, dashboard_project="", preview_label="Preview Plan", preview_kind="") -%}
<div class="flex-none gap-2">
    <button class="btn btn-sm btn-primary"
        hx-get="/partials/pr-plan?pr_number={{ pr_number }}&project={{ project }}{% if preview_kind %}&kind={{ preview_kind }}{% endif %}" hx-target="#main">
        {{ preview_label }}
    </button>
    <a href="{{ pr_url }}" target="_blank" class="btn btn-sm btn-ghost">GitHub</a>
    {% if dashboard_project %}
    <a class="btn btn-sm btn-ghost" hx-get="/partials/dashboard?project={{ dashboard_project }}"
        hx-target="#main">Dashboard</a>
    {% endif %}
</div>
{%- endmacro %}
