name: Terraform execution
description: Run the pinned Terraform plan or apply sequence for one validated project tuple.

inputs:
  mode:
    description: pr or apply
    required: true
  cloud:
    description: Selected target cloud
    required: true
  region:
    description: Selected regional manifest folder
    required: true
  environment_name:
    description: Selected logical environment
    required: true
  repository_layout:
    description: Protected repository layout identifier
    required: true
  orchestrator_repo:
    description: Approved Terraform orchestrator repository
    required: true
  orchestrator_ref:
    description: Approved Terraform orchestrator reference
    required: true
  bucket_name:
    description: OCI Object Storage state bucket
    required: true

runs:
  using: composite
  steps:
    # =====================================================================
    # Setup
    # =====================================================================
    - name: Prepare private work directory
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        WORK_TEMP=$(mktemp -d "$RUNNER_TEMP/mccp-terraform.XXXXXX")
        echo "MCCP_TERRAFORM_TEMP=$WORK_TEMP" >> "$GITHUB_ENV"

    - name: Checkout orchestrator
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.orchestrator_repo }}
        ref: ${{ inputs.orchestrator_ref }}
        path: ORCH

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4.0.1
      with:
        terraform_version: 1.12.1
        terraform_wrapper: false

    # =====================================================================
    # Resolve config
    # =====================================================================
    - name: Resolve config
      id: config
      shell: bash
      run: |
        CONFIG_REGION="${{ inputs.region }}"
        LAYOUT="${{ inputs.repository_layout }}"
        ENVIRONMENT_NAME="${{ inputs.environment_name }}"
        if [ "$LAYOUT" != "shared-nonprod-v2" ] && [ "$LAYOUT" != "production" ]; then
          echo "❌ Unsupported repository layout: $LAYOUT"; exit 1
        fi
        if [ "$LAYOUT" = "shared-nonprod-v2" ] && { [ -z "$ENVIRONMENT_NAME" ] || ! [[ "$ENVIRONMENT_NAME" =~ ^(dev|test|uat)$ ]]; }; then
          echo "❌ Shared non-production requests require dev, test, or uat"; exit 1
        fi
        if [ "$LAYOUT" = "production" ] && [ "$ENVIRONMENT_NAME" != "prod" ]; then
          echo "❌ Production requests require the prod environment"; exit 1
        fi
        if [ -z "$CONFIG_REGION" ]; then
          echo "❌ A resolved region input is required."
          exit 1
        fi

        CONFIG_SUBPATH="${{ inputs.cloud }}/$ENVIRONMENT_NAME/$CONFIG_REGION"
        if [ ! -d "$CONFIG_SUBPATH" ]; then
          echo "❌ Config directory not found: $CONFIG_SUBPATH"
          echo "Available directories under ${{ inputs.cloud }}/:"
          ls -la "${{ inputs.cloud }}" || true
          exit 1
        fi

        STATE_KEY="${{ inputs.bucket_name }}/${{ github.repository }}/$CONFIG_SUBPATH/terraform.tfstate"

        echo "config_subpath=$CONFIG_SUBPATH" >> $GITHUB_OUTPUT
        echo "CONFIG_REGION=$CONFIG_REGION" >> $GITHUB_ENV
        echo "STATE_KEY=$STATE_KEY" >> $GITHUB_ENV
        echo "BUCKET_NAME=${{ inputs.bucket_name }}" >> $GITHUB_ENV
        echo "✅ Config: $CONFIG_SUBPATH"

    - name: Prepare variables
      id: vars
      shell: bash
      env:
        MCCP_HANDOFF_REF: ${{ inputs.mode == 'pr' && github.event.pull_request.base.sha || github.sha }}
      run: |
        set -euo pipefail
        umask 077
        CONFIG_DIR="${{ github.workspace }}/${{ steps.config.outputs.config_subpath }}"
        PREPARED_VAR_DIR="$MCCP_TERRAFORM_TEMP/var-files"

        # Exclude lifecycle_operations/ directories - those JSON files are
        # for Ansible, not Terraform. Prepare copies under runner.temp so secret-backed
        # placeholders never modify the checked-out manifest repository.
        VAR_FILES=$(python3.11 "${{ github.action_path }}/../../scripts_python/prepare_var_files.py" \
          "$CONFIG_DIR" "$PREPARED_VAR_DIR" "${{ inputs.environment_name }}" \
          "${{ inputs.cloud }}" "${{ inputs.region }}")
        echo "var_files=$VAR_FILES" >> $GITHUB_OUTPUT

        EXTRA=""
        if [ "${{ inputs.cloud }}" = "oci" ]; then
          if [ -z "${CONFIG_REGION:-}" ]; then
            echo "❌ CONFIG_REGION missing from the resolved region input"
            exit 1
          fi

          # Only override region. Project repositories should not create OCI IAM
          # foundation resources; Cloud Operations owns the project foundation.
          EXTRA="-var=region=$CONFIG_REGION"
        elif [ "${{ inputs.cloud }}" = "gcp" ]; then
          if [ -z "${CONFIG_REGION:-}" ]; then
            echo "❌ CONFIG_REGION missing from the resolved region input"
            exit 1
          fi

          # GCP config folders are Google provider regions such as europe-west2.
          EXTRA="-var=location=$CONFIG_REGION"
        fi
        echo "extra=$EXTRA" >> $GITHUB_OUTPUT


    # =====================================================================
    # Auth & Backend
    # =====================================================================
    - name: Authenticate Azure
      if: inputs.cloud == 'azure'
      shell: bash
      run: |
        set -euo pipefail
        : "${ARM_CLIENT_ID:?ARM_CLIENT_ID is required}"
        : "${ARM_TENANT_ID:?ARM_TENANT_ID is required}"
        : "${ARM_SUBSCRIPTION_ID:?ARM_SUBSCRIPTION_ID is required}"
        if [ -n "${ARM_CLIENT_CERTIFICATE_PATH:-}" ]; then
          if [ ! -f "$ARM_CLIENT_CERTIFICATE_PATH" ] || [ ! -r "$ARM_CLIENT_CERTIFICATE_PATH" ] || [ ! -s "$ARM_CLIENT_CERTIFICATE_PATH" ]; then
            echo "Azure client certificate must be a readable, nonempty PFX file." >&2
            exit 1
          fi
          # AzureRM reads the PFX and optional password directly from ARM_*.
          # A CLI service-principal session is not a provider credential.
          {
            echo "ARM_USE_CLI=false"
            echo "ARM_CLIENT_SECRET="
          } >> "$GITHUB_ENV"
          echo "Using direct AzureRM client certificate authentication."
        else
          : "${ARM_CLIENT_SECRET:?Set ARM_CLIENT_CERTIFICATE_PATH or ARM_CLIENT_SECRET}"
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
        fi

    - name: Authenticate Google
      if: inputs.cloud == 'gcp'
      shell: bash
      run: |
        if [ -n "${GOOGLE_CREDENTIALS:-}" ]; then
          echo "✅ Using GOOGLE_CREDENTIALS for Google provider authentication"
          exit 0
        fi

        if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
          echo "✅ Using GOOGLE_APPLICATION_CREDENTIALS for Google provider authentication"
          exit 0
        fi

        if command -v gcloud >/dev/null 2>&1 && gcloud auth application-default print-access-token >/dev/null 2>&1; then
          echo "✅ Using existing Google Application Default Credentials"
          exit 0
        fi

        echo "❌ Google authentication is not configured. Set GOOGLE_CREDENTIALS, GOOGLE_APPLICATION_CREDENTIALS, or ADC on the runner."
        exit 1

    - name: Generate providers.tf
      shell: bash
      run: |
        # Use namespace from runner environment variable
        NAMESPACE="$STATE_NAMESPACE"
        if [ -z "$NAMESPACE" ]; then
          echo "❌ STATE_NAMESPACE is not set on the runner"
          exit 1
        fi

        # OCI Object Storage buckets are regional. We always take the bucket
        # region from the runner (STATE_REGION) to avoid coupling it to the
        # manifest folder name.
        if [ -z "${STATE_REGION:-}" ]; then
          echo "❌ STATE_REGION is required (OCI Object Storage bucket region)"
          exit 1
        fi
        BACKEND_REGION="$STATE_REGION"

        # Write backend.tf (Common)
        # We use OCI Object Storage for state regardless of the target cloud
        cat > ORCH/backend.tf << EOF
        terraform {
          backend "oci" {
            bucket    = "$BUCKET_NAME"
            key       = "$STATE_KEY"
            namespace = "$NAMESPACE"
            auth      = "InstancePrincipal"
            region    = "$BACKEND_REGION"
          }
        }
        EOF

        # Write providers.tf (Cloud specific)
        if [ "${{ inputs.cloud }}" = "oci" ]; then
          cat > ORCH/providers.tf << EOF
        provider "oci" {
          auth   = "InstancePrincipal"
          region = var.region
          ignore_defined_tags = ["Oracle-Tags.CreatedBy", "Oracle-Tags.CreatedOn"]
        }
        provider "oci" {
          auth   = "InstancePrincipal"
          alias  = "home"
          region = var.region
          ignore_defined_tags = ["Oracle-Tags.CreatedBy", "Oracle-Tags.CreatedOn"]
        }
        provider "oci" {
          auth   = "InstancePrincipal"
          alias  = "secondary_region"
          region = var.region
          ignore_defined_tags = ["Oracle-Tags.CreatedBy", "Oracle-Tags.CreatedOn"]
        }
        terraform {
          required_version = ">= 1.12.0"
          required_providers {
            oci = { source = "oracle/oci", configuration_aliases = [oci.home] }
          }
        }
        EOF
        elif [ "${{ inputs.cloud }}" = "azure" ]; then
          cat > ORCH/providers.tf << EOF
        provider "azurerm" {
          features {}
        }
        terraform {
          required_version = ">= 1.12.0"
          required_providers {
            azurerm = { source = "hashicorp/azurerm", version = "~> 4.0" }
          }
        }
        EOF
        elif [ "${{ inputs.cloud }}" = "gcp" ]; then
          cat > ORCH/providers.tf << EOF
        provider "google" {
          project = var.project_id
          region  = var.location
        }
        terraform {
          required_version = ">= 1.4.0"
          required_providers {
            google = { source = "hashicorp/google", version = ">= 7.35.0, < 8.0.0" }
          }
        }
        EOF
        else
          echo "❌ Unsupported cloud: ${{ inputs.cloud }}"
          exit 1
        fi

        terraform -chdir=ORCH fmt providers.tf
        terraform -chdir=ORCH fmt backend.tf
        echo "✅ Generated providers.tf"

    # =====================================================================
    # Terraform
    # =====================================================================
    - name: Terraform init
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3 4 5; do
          if terraform -chdir=ORCH init -input=false -no-color; then
            exit 0
          fi
          if [ "$attempt" -eq 5 ]; then
            echo "Terraform init failed after $attempt attempts." >&2
            exit 1
          fi
          delay_seconds=$((attempt * 10))
          echo "Terraform init failed; retrying in ${delay_seconds}s..." >&2
          sleep "$delay_seconds"
        done

    - name: Terraform validate
      id: validate
      if: inputs.mode == 'pr'
      shell: bash
      run: terraform -chdir=ORCH validate -no-color

    - name: Terraform plan
      id: plan
      shell: bash
      working-directory: ORCH
      run: |
        set -euo pipefail
        umask 077
        # Native Vault data sources can contain Base64 values that the provider
        # does not mark sensitive. Never stream the raw plan or diagnostics.
        unset TF_LOG TF_LOG_PATH TF_LOG_CORE TF_LOG_PROVIDER
        set +e
        terraform plan -detailed-exitcode -no-color \
          ${{ steps.vars.outputs.extra }} ${{ steps.vars.outputs.var_files }} \
          -out=tfplan.binary > "$MCCP_TERRAFORM_TEMP/plan.log" 2>&1
        EXIT=$?
        set -e
        echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
        if [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 2 ]; then
          echo "Terraform plan failed (exit $EXIT)." >&2
          python3.11 "${{ github.action_path }}/../../scripts_python/summarize_plan.py" --diagnostics plan \
            < "$MCCP_TERRAFORM_TEMP/plan.log" >&2 2>/dev/null || \
            echo "Raw diagnostics are withheld because they may contain secrets." >&2
          exit "$EXIT"
        fi
        terraform show -json tfplan.binary > "$MCCP_TERRAFORM_TEMP/plan.json" 2> "$MCCP_TERRAFORM_TEMP/show.log"
        python3.11 "${{ github.action_path }}/../../scripts_python/summarize_plan.py" \
          --format json < "$MCCP_TERRAFORM_TEMP/plan.json" \
          > "$MCCP_TERRAFORM_TEMP/review.json"
        jq -r '.summary, .detail' "$MCCP_TERRAFORM_TEMP/review.json"
        echo "review_file=$MCCP_TERRAFORM_TEMP/review.json" >> "$GITHUB_OUTPUT"

    - name: Terraform apply
      if: inputs.mode == 'apply'
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        unset TF_LOG TF_LOG_PATH TF_LOG_CORE TF_LOG_PROVIDER
        # Apply the exact binary plan. Keep provider diagnostics private too.
        if terraform -chdir=ORCH apply -auto-approve -no-color tfplan.binary \
          > "$MCCP_TERRAFORM_TEMP/apply.log" 2>&1; then
          echo "Apply completed."
        else
          EXIT=$?
          echo "Terraform apply failed (exit $EXIT)." >&2
          python3.11 "${{ github.action_path }}/../../scripts_python/summarize_plan.py" --diagnostics apply \
            < "$MCCP_TERRAFORM_TEMP/apply.log" >&2 2>/dev/null || \
            echo "Raw diagnostics are withheld because they may contain secrets." >&2
          exit "$EXIT"
        fi

    # =====================================================================
    # PR Comment
    # =====================================================================
    - name: Comment on PR
      if: always() && inputs.mode == 'pr' && github.event.pull_request
      uses: actions/github-script@v8
      env:
        REVIEW_FILE: ${{ steps.plan.outputs.review_file }}
        PLAN_STATUS: ${{ steps.plan.outcome }}
        VALIDATE_STATUS: ${{ steps.validate.outcome }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      with:
        script: |
          const fs = require("fs")
          const ready = process.env.PLAN_STATUS === "success" &&
            process.env.VALIDATE_STATUS === "success"
          const unavailable = "Plan unavailable; inspect the failed preparation or execution step."
          let review = null
          if (ready) {
            if (!process.env.REVIEW_FILE) throw new Error("The safe plan review is missing.")
            review = JSON.parse(fs.readFileSync(process.env.REVIEW_FILE, "utf8"))
            if (typeof review.summary !== "string" || typeof review.detail !== "string") {
              throw new Error("The safe plan review has an invalid format.")
            }
          }
          const summary = ready ? review.summary : unavailable
          const detail = ready ? review.detail : unavailable
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          const bodyFor = (text, part, count) => [
            "#### Terraform Plan",
            `Commit: \`${process.env.HEAD_SHA}\``,
            `Run: [${context.runId}, attempt ${process.env.RUN_ATTEMPT}](${runUrl})`,
            `**Plan:** \`${process.env.PLAN_STATUS}\` · **Validate:** \`${process.env.VALIDATE_STATUS}\``,
            "### Planned impact",
            summary,
            `<details><summary>Detailed sanitized plan${count > 1 ? ` (part ${part} of ${count})` : ""}</summary>`,
            "```terraform", text, "```", "</details>",
            "This is a plan, not a deployment result. Independent human review and merge are required.",
          ].join("\n\n")
          // Only the formatter's public strings are written here. Raw plans,
          // data sources, variables and outputs remain in the private work dir.
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, bodyFor(detail, 1, 1) + "\n")
          if (summary.length > 10000) throw new Error("Sanitized impact summary exceeds the PR comment limit; review the job summary.")
          const chunks = []
          let chunk = ""
          for (const line of detail.split("\n")) {
            if (line.length > 40000) throw new Error("Sanitized plan line exceeds the PR comment limit; review the job summary.")
            if (chunk.length + line.length + 1 > 40000) {
              chunks.push(chunk)
              chunk = ""
            }
            chunk += line + "\n"
          }
          if (chunk || chunks.length === 0) chunks.push(chunk)
          const bodies = chunks.map((text, index) => bodyFor(text.trimEnd(), index + 1, chunks.length))
          if (bodies.some(body => body.length > 60000)) throw new Error("Sanitized PR comment exceeds its size limit.")
          for (const body of bodies) {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })
          }

    - name: Record PR validation
      if: success() && inputs.mode == 'pr' && github.event.pull_request && steps.plan.outcome == 'success' && steps.validate.outcome == 'success'
      uses: actions/github-script@v8
      with:
        script: |
          const pr = context.payload.pull_request;
          core.notice(JSON.stringify({
            repository: `${context.repo.owner}/${context.repo.repo}`,
            pull_request: pr.number,
            head_sha: pr.head.sha,
            base_sha: pr.base.sha,
            run_id: context.runId,
            run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            kind: "terraform-plan",
          }), {title: "MCCP PR validation v1", file: ".github/workflows/terraform.yaml", startLine: 1});

    - name: Remove private Terraform files
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${MCCP_TERRAFORM_TEMP:-}" ]; then
          case "$MCCP_TERRAFORM_TEMP" in
            "$RUNNER_TEMP"/mccp-terraform.*) rm -rf -- "$MCCP_TERRAFORM_TEMP" ;;
            *) echo "Unexpected private work directory; refusing cleanup" >&2; exit 1 ;;
          esac
        fi
        # ORCH is the disposable checkout created by this action, not the
        # project configuration. Plans and provider caches must not survive it.
        rm -rf -- "$GITHUB_WORKSPACE/ORCH"
