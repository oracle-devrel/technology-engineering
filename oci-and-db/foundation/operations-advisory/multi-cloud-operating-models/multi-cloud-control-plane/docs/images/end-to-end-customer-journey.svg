<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">MCCP V2 governed customer journey</title>
  <desc id="description">Cloud Operations prepares and hands off the project boundary. Project Teams use a direct GitHub pull request, the optional UI, or the optional Codex assistant. A reviewer approves the plan or check, and a trusted runner executes only after merge and records evidence and inventory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#c74634"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#312d2a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { fill:#312d2a; font-family:"Oracle Sans", Arial, sans-serif; font-size:48px; font-weight:700; }
      .subtitle { fill:#706a67; font-family:"Oracle Sans", Arial, sans-serif; font-size:23px; }
      .card-title { fill:#312d2a; font-family:"Oracle Sans", Arial, sans-serif; font-size:26px; font-weight:700; text-anchor:middle; }
      .card-copy { fill:#504b48; font-family:"Oracle Sans", Arial, sans-serif; font-size:20px; text-anchor:middle; }
      .small-title { fill:#312d2a; font-family:"Oracle Sans", Arial, sans-serif; font-size:18px; font-weight:700; text-anchor:middle; }
      .small-copy { fill:#504b48; font-family:"Oracle Sans", Arial, sans-serif; font-size:15px; text-anchor:middle; }
      .arrow { fill:none; stroke:#c74634; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .divider { stroke:#c74634; stroke-width:5; stroke-linecap:round; }
      .tag { fill:#c74634; font-family:"Oracle Sans", Arial, sans-serif; font-size:18px; font-weight:700; letter-spacing:1.2px; text-anchor:middle; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fcfbfa"/>

  <text x="80" y="88" class="title">The governed request journey</text>
  <text x="80" y="124" class="subtitle">One operating boundary for OCI, Azure, and GCP workloads</text>

  <g filter="url(#softShadow)">
    <path d="M85 178 Q92 161 119 165 Q224 158 337 166 Q351 172 347 194 L344 276 Q340 292 317 290 Q207 298 112 290 Q91 286 93 266 Z" fill="#b8cabb" stroke="#312d2a" stroke-width="3"/>
    <text x="220" y="213" class="card-title">CLOUD OPERATIONS</text>
    <text x="220" y="244" class="card-copy">Foundation and guardrails</text>
    <text x="220" y="269" class="card-copy">OP04 and reviewed handoff</text>

    <path d="M475 178 Q482 161 510 166 Q616 158 730 166 Q744 172 741 194 L738 276 Q735 292 712 290 Q603 298 503 290 Q481 286 483 266 Z" fill="#e6a377" stroke="#312d2a" stroke-width="3"/>
    <text x="610" y="213" class="card-title">HANDOFF</text>
    <text x="610" y="244" class="card-copy">Approved references, catalog,</text>
    <text x="610" y="269" class="card-copy">and operating boundary</text>

    <path d="M870 178 Q877 161 905 166 Q1012 158 1126 166 Q1140 172 1137 194 L1134 276 Q1131 292 1108 290 Q998 298 898 290 Q876 286 878 266 Z" fill="#facd62" stroke="#312d2a" stroke-width="3"/>
    <text x="1005" y="213" class="card-title">PROJECT TEAM</text>
    <text x="1005" y="244" class="card-copy">Handed-off project repository</text>
    <text x="1005" y="269" class="card-copy">OCI · Azure · GCP</text>
  </g>

  <path d="M357 229 C396 229 424 229 458 229" class="arrow"/>
  <path d="M751 229 C790 229 818 229 853 229" class="arrow"/>
  <text x="415" y="157" class="tag">PREPARE</text>
  <text x="805" y="157" class="tag">HAND OFF</text>

  <path d="M1005 308 C1005 347 1005 363 1005 398" class="arrow"/>
  <text x="1120" y="354" class="tag">REQUEST</text>

  <text x="704" y="380" class="tag">CHOOSE A REQUEST INTERFACE</text>
  <g filter="url(#softShadow)">
    <path d="M178 423 Q183 410 203 413 Q322 408 438 414 Q451 420 449 437 L447 514 Q444 527 426 525 Q317 531 203 525 Q184 522 186 506 Z" fill="#fcfbfa" stroke="#2b6242" stroke-width="3"/>
    <text x="317" y="454" class="small-title">DIRECT GITHUB PR</text>
    <text x="317" y="480" class="small-copy">The standard path</text>
    <text x="317" y="501" class="small-copy">Always available</text>

    <path d="M579 423 Q584 410 604 413 Q723 408 839 414 Q852 420 850 437 L848 514 Q845 527 827 525 Q718 531 604 525 Q585 522 587 506 Z" fill="#fcfbfa" stroke="#2b6242" stroke-width="3"/>
    <text x="718" y="454" class="small-title">OPTIONAL UI</text>
    <text x="718" y="480" class="small-copy">Form-led request</text>
    <text x="718" y="501" class="small-copy">Issue, branch, commit, PR</text>

    <path d="M980 423 Q985 410 1005 413 Q1124 408 1240 414 Q1253 420 1251 437 L1249 514 Q1246 527 1228 525 Q1119 531 1005 525 Q986 522 988 506 Z" fill="#fcfbfa" stroke="#2b6242" stroke-width="3"/>
    <text x="1119" y="454" class="small-title">OPTIONAL CODEX ASSISTANT</text>
    <text x="1119" y="480" class="small-copy">Confirmation-gated request</text>
    <text x="1119" y="501" class="small-copy">Same governed PR</text>
  </g>

  <path d="M317 546 C317 592 469 598 619 610" class="arrow"/>
  <path d="M718 546 C718 573 718 583 718 610" class="arrow"/>
  <path d="M1119 546 C1119 592 967 598 817 610" class="arrow"/>

  <g filter="url(#softShadow)">
    <path d="M530 629 Q537 611 563 616 Q708 607 855 616 Q871 622 868 648 L866 733 Q862 751 837 748 Q700 756 557 748 Q535 744 537 719 Z" fill="#facd62" stroke="#312d2a" stroke-width="3"/>
    <text x="701" y="659" class="card-title">GITHUB REVIEW</text>
    <text x="701" y="690" class="card-copy">Plan or check, human approval,</text>
    <text x="701" y="715" class="card-copy">then merge</text>

    <path d="M1060 629 Q1067 611 1093 616 Q1238 607 1385 616 Q1401 622 1398 648 L1396 733 Q1392 751 1367 748 Q1230 756 1087 748 Q1065 744 1067 719 Z" fill="#b8cabb" stroke="#312d2a" stroke-width="3"/>
    <text x="1231" y="659" class="card-title">TRUSTED RUNNER</text>
    <text x="1231" y="690" class="card-copy">Executes only after merge</text>
    <text x="1231" y="715" class="card-copy">Evidence and inventory</text>
  </g>

  <path d="M885 682 C940 682 982 682 1041 682" class="arrow"/>

  <line x1="81" y1="821" x2="1518" y2="821" class="divider"/>
  <text x="800" y="863" class="card-title">GOVERNED SELF-SERVICE: PROJECT TEAMS REQUEST, REVIEWERS APPROVE, RUNNERS EXECUTE</text>
</svg>
