{% macro change_reference_field() -%}
<div class="divider text-xs text-base-content/30">Change Management</div>
<div class="form-control mb-6">
    <label class="label">
        <span class="label-text font-semibold">Change Reference</span>
        <span class="label-text-alt text-base-content/30">Optional</span>
    </label>
    <input type="text" name="change_reference" class="input input-bordered w-full"
        placeholder="CRQ, CHG, JIRA ticket..." />
    <label class="label">
        <span class="label-text-alt text-base-content/30">Will appear in the PR title and audit log</span>
    </label>
</div>
{%- endmacro %}
