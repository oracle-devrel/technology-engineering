name: Shared non-production OCI operations

on:
  pull_request_target:
    branches: [main]
    paths: ["oci/**/lifecycle_operations/**"]
  push:
    branches: [main]
    paths: ["oci/**/lifecycle_operations/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-path:
    if: vars.PROJECT_AUTOMATION_READY == 'true'
    runs-on: [self-hosted, control-plane-resolver]
    outputs:
      environment: ${{ steps.path.outputs.environment }}
      operation_file: ${{ steps.path.outputs.operation_file }}
      security_profile: ${{ steps.path.outputs.security_profile }}
      runner_labels: ${{ steps.path.outputs.runner_labels }}
      execute_operation: ${{ steps.path.outputs.execute_operation }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - id: path
        shell: bash
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request_target ]; then
            test "$PR_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          fi
          security_profile=repository-secrets
          test "$security_profile" = repository-secrets
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          git fetch --no-tags origin "$base_sha" "${{ github.event.pull_request.head.sha || github.sha }}"
          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          all_changed=$(git diff --name-only "$base_sha" "$head_sha")
          changed=$(printf '%s\n' "$all_changed" | rg '^oci/(dev|test|uat)/[A-Za-z0-9._-]+/lifecycle_operations/[A-Za-z0-9._-]+\.json$' || true)
          test -n "$changed" && test "$all_changed" = "$changed"
          execute_operation="true"
          while IFS= read -r path; do
            if git ls-tree "$head_sha" -- "$path" | rg '^100644 blob [0-9a-f]{40}\t' >/dev/null; then
              git show "$head_sha:$path" | jq -e . >/dev/null
            else
              git ls-tree "$base_sha" -- "$path" | rg '^100644 blob [0-9a-f]{40}\t' >/dev/null
              execute_operation="false"
            fi
          done <<< "$changed"
          test "$(printf '%s\n' "$changed" | cut -d/ -f1-3 | sort -u | wc -l | tr -d ' ')" = 1
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          environment=$(printf '%s\n' "$changed" | head -1 | cut -d/ -f2)
          operation_file=$(printf '%s\n' "$changed" | head -1)
          runner_labels=$(jq -nc --arg environment "$environment" \
            '["self-hosted", "oci", $environment]')
          {
            echo "environment=$environment"
            echo "operation_file=$operation_file"
            echo "security_profile=$security_profile"
            echo "runner_labels=$runner_labels"
            echo "execute_operation=$execute_operation"
          } >> "$GITHUB_OUTPUT"
  execute:
    needs: validate-path
    if: needs.validate-path.outputs.execute_operation == 'true'
    uses: __CUSTOMER_ORG__/platform-ci/.github/workflows/ansible-shared.yaml@__PLATFORM_CI_REF__
    with:
      mode: ${{ github.event_name == 'push' && 'execute' || 'check' }}
      cloud: oci
      environment_name: ${{ needs.validate-path.outputs.environment }}
      security_profile: ${{ needs.validate-path.outputs.security_profile }}
      manifest_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      platform_ci_ref: __PLATFORM_CI_REF__
      readiness_marker: ${{ needs.validate-path.outputs.environment == 'dev' && vars.CONTROL_PLANE_READY_DEV || needs.validate-path.outputs.environment == 'test' && vars.CONTROL_PLANE_READY_TEST || needs.validate-path.outputs.environment == 'uat' && vars.CONTROL_PLANE_READY_UAT || '' }}
      operation_file: ${{ needs.validate-path.outputs.operation_file }}
      runner_labels: ${{ needs.validate-path.outputs.runner_labels }}
      bucket_name: __STATE_BUCKET__
    secrets:
      PLATFORM_CI_DEPLOY_KEY: ${{ secrets.PLATFORM_CI_DEPLOY_KEY }}
