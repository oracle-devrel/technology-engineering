name: Azure Terraform

on:
    pull_request:
        branches: [main]
        paths:
            - "azure/**"
            - "!azure/**/ansible/**"
    push:
        branches: [main]
        paths:
            - "azure/**"
            - "!azure/**/ansible/**"
    workflow_dispatch:

jobs:
    terraform:
        if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
        uses: __CUSTOMER_ORG__/platform-ci/.github/workflows/terraform-shared.yaml@__PLATFORM_CI_REF__
        secrets: inherit
        with:
            mode: ${{ github.event_name == 'push' && 'apply' || 'pr' }}
            cloud: azure
            orchestrator_repo: oci-clickops/clickops-orchestrator-azure
            orchestrator_ref: 2d0b532f7639212f1b7c2708cd15b71d80b217fe
            bucket_name: gitops-state-bucket
