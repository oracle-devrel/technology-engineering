name: Shared Terraform Workflow

on:
  workflow_call:
    inputs:
      mode:
        description: "pr or apply"
        required: true
        type: string
      cloud:
        description: "oci, azure, or gcp"
        required: true
        type: string
      region:
        description: "Config region folder name (e.g., eu-frankfurt-1, westeurope, europe-west2). If omitted, the workflow auto-detects it from changed files or uses REGION from the runner."
        required: false
        type: string
        default: ""
      environment_name:
        description: "Selected deployment environment (dev, test, uat, or prod)"
        required: true
        type: string
      security_profile:
        description: "github-environments or repository-secrets"
        required: true
        type: string
      readiness_marker:
        description: "Environment-specific repository readiness variable"
        required: false
        type: string
        default: ""
      repository_layout:
        description: "Protected repository layout identifier"
        required: true
        type: string
      manifest_ref:
        description: "Validated manifest repository commit"
        required: true
        type: string
      platform_ci_ref:
        description: "Approved immutable Platform CI commit"
        required: true
        type: string
      orchestrator_repo:
        description: "Repository for Terraform modules"
        required: true
        type: string
      orchestrator_ref:
        description: "Approved immutable orchestrator commit"
        required: true
        type: string
      bucket_name:
        description: "Bucket name for Terraform state"
        required: true
        type: string
      runner_labels:
        description: "Runner labels as JSON array"
        required: false
        type: string
        default: '["self-hosted","oci"]'
    secrets:
      PLATFORM_CI_DEPLOY_KEY:
        description: "Read-only deploy key for this private Platform CI repository"
        required: true
      GITOPS_SECRET_VALUES:
        description: "Selected GitHub Environment JSON map; empty for repository-secrets"
        required: false
      READINESS_MARKER:
        description: "Selected GitHub Environment readiness secret; empty for repository-secrets"
        required: false
      repository_secret_values:
        description: "Repository-secret JSON map; empty for github-environments"
        required: false

jobs:
  terraform-environments:
    if: inputs.security_profile == 'github-environments'
    name: "Terraform ${{ inputs.mode }}"
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    environment:
      name: ${{ inputs.mode == 'apply' && format('{0}-apply', inputs.environment_name) || inputs.environment_name }}
      deployment: ${{ inputs.mode == 'apply' }}
    concurrency:
      group: ${{ inputs.cloud }}-${{ inputs.environment_name }}-terraform-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout validated manifest
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.manifest_ref }}
          fetch-depth: 0
      - name: Checkout pinned Platform CI
        uses: actions/checkout@v6
        with:
          repository: __CUSTOMER_ORG__/platform-ci
          ref: ${{ inputs.platform_ci_ref }}
          path: platform-ci
          ssh-key: ${{ secrets.PLATFORM_CI_DEPLOY_KEY }}
      - name: Execute Terraform
        uses: ./platform-ci/actions/terraform-execution
        with:
          mode: ${{ inputs.mode }}
          cloud: ${{ inputs.cloud }}
          region: ${{ inputs.region }}
          environment_name: ${{ inputs.environment_name }}
          security_profile: ${{ inputs.security_profile }}
          readiness_marker: ${{ inputs.readiness_marker }}
          repository_layout: ${{ inputs.repository_layout }}
          orchestrator_repo: ${{ inputs.orchestrator_repo }}
          orchestrator_ref: ${{ inputs.orchestrator_ref }}
          bucket_name: ${{ inputs.bucket_name }}
          environment_readiness_marker: ${{ secrets.READINESS_MARKER }}
          environment_secret_values: ${{ secrets.GITOPS_SECRET_VALUES }}
          repository_secret_values: ${{ secrets.repository_secret_values }}
  terraform-repository:
    if: inputs.security_profile == 'repository-secrets'
    name: "Terraform ${{ inputs.mode }}"
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    concurrency:
      group: ${{ inputs.cloud }}-${{ inputs.environment_name }}-terraform-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout validated manifest
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.manifest_ref }}
          fetch-depth: 0
      - name: Checkout pinned Platform CI
        uses: actions/checkout@v6
        with:
          repository: __CUSTOMER_ORG__/platform-ci
          ref: ${{ inputs.platform_ci_ref }}
          path: platform-ci
          ssh-key: ${{ secrets.PLATFORM_CI_DEPLOY_KEY }}
      - name: Execute Terraform
        uses: ./platform-ci/actions/terraform-execution
        with:
          mode: ${{ inputs.mode }}
          cloud: ${{ inputs.cloud }}
          region: ${{ inputs.region }}
          environment_name: ${{ inputs.environment_name }}
          security_profile: ${{ inputs.security_profile }}
          readiness_marker: ${{ inputs.readiness_marker }}
          repository_layout: ${{ inputs.repository_layout }}
          orchestrator_repo: ${{ inputs.orchestrator_repo }}
          orchestrator_ref: ${{ inputs.orchestrator_ref }}
          bucket_name: ${{ inputs.bucket_name }}
          environment_readiness_marker: ${{ secrets.READINESS_MARKER }}
          environment_secret_values: ${{ secrets.GITOPS_SECRET_VALUES }}
          repository_secret_values: ${{ secrets.repository_secret_values }}
