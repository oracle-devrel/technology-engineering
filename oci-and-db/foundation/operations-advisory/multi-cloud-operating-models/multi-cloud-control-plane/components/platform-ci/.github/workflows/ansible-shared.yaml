name: Shared Ansible Workflow

on:
  workflow_call:
    inputs:
      mode:
        description: "check or execute"
        required: true
        type: string
      cloud:
        description: "oci or azure"
        required: true
        type: string
      operation_file:
        description: "Path to operation JSON file (auto-detected if not provided)"
        required: false
        type: string
      bucket_name:
        description: "Bucket name for state"
        required: true
        type: string
      environment_name:
        description: "Selected deployment environment (dev, test, uat, or prod)"
        required: true
        type: string
      security_profile:
        description: "github-environments or repository-secrets"
        required: true
        type: string
      manifest_ref:
        description: "Validated manifest repository commit"
        required: true
        type: string
      platform_ci_ref:
        description: "Approved immutable Platform CI commit"
        required: true
        type: string
      readiness_marker:
        description: "Environment-specific repository readiness variable"
        required: false
        type: string
        default: ""
      runner_labels:
        description: "Runner labels as JSON array"
        required: false
        type: string
        default: '["self-hosted","oci"]'
    secrets:
      READINESS_MARKER:
        description: "Selected GitHub Environment readiness secret; empty for repository-secrets"
        required: false

jobs:
  ansible-environments:
    if: inputs.security_profile == 'github-environments'
    name: "Ansible ${{ inputs.mode }}"
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    environment:
      name: ${{ inputs.mode == 'execute' && format('{0}-apply', inputs.environment_name) || inputs.environment_name }}
      deployment: ${{ inputs.mode == 'execute' }}
    concurrency:
      group: ${{ inputs.cloud }}-${{ inputs.environment_name }}-ansible-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout validated manifest
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.manifest_ref }}
          fetch-depth: 0
      - name: Checkout pinned Platform CI
        uses: actions/checkout@v6
        with:
          repository: __CUSTOMER_ORG__/platform-ci
          ref: ${{ inputs.platform_ci_ref }}
          path: platform-ci
      - name: Execute Ansible
        uses: ./platform-ci/actions/ansible-execution
        with:
          mode: ${{ inputs.mode }}
          cloud: ${{ inputs.cloud }}
          operation_file: ${{ inputs.operation_file }}
          bucket_name: ${{ inputs.bucket_name }}
          environment_name: ${{ inputs.environment_name }}
          security_profile: ${{ inputs.security_profile }}
          readiness_marker: ${{ inputs.readiness_marker }}
          environment_readiness_marker: ${{ secrets.READINESS_MARKER }}
  ansible-repository:
    if: inputs.security_profile == 'repository-secrets'
    name: "Ansible ${{ inputs.mode }}"
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    concurrency:
      group: ${{ inputs.cloud }}-${{ inputs.environment_name }}-ansible-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout validated manifest
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.manifest_ref }}
          fetch-depth: 0
      - name: Checkout pinned Platform CI
        uses: actions/checkout@v6
        with:
          repository: __CUSTOMER_ORG__/platform-ci
          ref: ${{ inputs.platform_ci_ref }}
          path: platform-ci
      - name: Execute Ansible
        uses: ./platform-ci/actions/ansible-execution
        with:
          mode: ${{ inputs.mode }}
          cloud: ${{ inputs.cloud }}
          operation_file: ${{ inputs.operation_file }}
          bucket_name: ${{ inputs.bucket_name }}
          environment_name: ${{ inputs.environment_name }}
          security_profile: ${{ inputs.security_profile }}
          readiness_marker: ${{ inputs.readiness_marker }}
          environment_readiness_marker: ${{ secrets.READINESS_MARKER }}
