name: OCI Project Foundation Handoff

on:
  workflow_dispatch:
    inputs:
      project:
        description: Canonical OP04 project slug
        required: true
        type: string
  workflow_call:
    inputs:
      project:
        description: Canonical OP04 project slug
        required: true
        type: string

permissions:
  contents: read

jobs:
  handoff:
    name: Generate project-foundation handoff artifact
    if: >-
      vars.FOUNDATION_AUTOMATION_READY == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.FOUNDATION_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 15
    env:
      PROJECT: ${{ inputs.project }}
      STATE_BUCKET: ${{ vars.OCI_TF_STATE_BUCKET }}
      STATE_NAMESPACE: ${{ vars.OCI_TF_STATE_NAMESPACE }}
      STATE_REGION: ${{ vars.REGION }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Render artifact-only handoff
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT" =~ ^(dev|test|uat|prod)-([a-z][a-z0-9]*(-[a-z0-9]+)*)$ ]]
          environment="${BASH_REMATCH[1]}"
          project_name="${BASH_REMATCH[2]}"
          if [ "$environment" = "prod" ]; then
            target_repository="prod-$project_name"
          else
            target_repository="nonprod-$project_name"
          fi
          handoff_path="environments/$environment/environment_information.md"
          project_directory="op04_manage_project/$environment/$PROJECT"
          test -f "$project_directory/generated/iam.json"
          for variable in \
            STATE_BUCKET STATE_NAMESPACE STATE_REGION
          do
            test -n "${!variable}" || {
              echo "Required variable is empty: $variable" >&2
              exit 1
            }
          done
          contract=".github/project-onboarding-contract.json"
          blueprint="$(
            jq -er --arg environment "$environment" '
              select(
                .contract_version == 3 and
                (.allowed_environments | index($environment)) != null
              ) |
              .environment_blueprints[$environment]
            ' "$contract"
          )"
          test -f "$blueprint"
          jq -e --arg environment "$environment" '
            .schema_version == 2 and .environment == $environment
          ' "$blueprint" >/dev/null
          artifact_directory="$RUNNER_TEMP/project-handoff-$GITHUB_RUN_ID"
          state_directory="$RUNNER_TEMP/op04-state-$GITHUB_RUN_ID"
          mkdir -p "$artifact_directory" "$state_directory"
          cat > "$state_directory/backend.tf" <<'EOF'
          terraform {
            backend "oci" {}
          }
          EOF
          op02_state_key="op02_manage_environment/$environment/terraform.tfstate"
          op04_state_key="$project_directory/terraform.tfstate"
          terraform -chdir="$state_directory" init -input=false -no-color \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="namespace=$STATE_NAMESPACE" \
            -backend-config="region=$STATE_REGION" \
            -backend-config="auth=InstancePrincipal" \
            -backend-config="key=$op04_state_key"
          terraform -chdir="$state_directory" output -json \
            > "$state_directory/op04-output.json"
          python3 scripts/render_project_handoff.py \
            --project "$PROJECT" \
            --project-directory "$project_directory" \
            --op04-output "$state_directory/op04-output.json" \
            --environment-blueprint "$blueprint" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-workflow "$GITHUB_WORKFLOW" \
            --source-run "$GITHUB_RUN_ID" \
            --source-commit "$GITHUB_SHA" \
            --op02-state-key "$op02_state_key" \
            --op04-state-key "$op04_state_key" \
            --target-repository "$target_repository" \
            --handoff-path "$handoff_path" \
            --output "$artifact_directory/environment_information.md" \
            --handoff-output \
              "$artifact_directory/project-foundation-handoff.json"

      - name: Upload handoff artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: project-foundation-handoff-${{ inputs.project }}
          path: ${{ runner.temp }}/project-handoff-${{ github.run_id }}/
          if-no-files-found: error
