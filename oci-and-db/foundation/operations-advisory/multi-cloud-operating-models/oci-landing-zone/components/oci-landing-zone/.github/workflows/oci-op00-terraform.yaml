name: OCI OP00 global Landing Zone

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'op00_manage_global_landing_zone/generated/**'
      - 'op00_manage_global_landing_zone/operation.json'
  push:
    branches: [main]
    paths:
      - 'op00_manage_global_landing_zone/generated/**'
      - 'op00_manage_global_landing_zone/operation.json'

permissions:
  contents: read

env:
  ORCHESTRATOR_REVISION: fcf1d7f02c0b4faa1ff55f1776c396452dd51761
  STATE_KEY: op00_manage_global_landing_zone/terraform.tfstate

jobs:
  op00:
    name: Plan and apply OP00
    if: >-
      vars.FOUNDATION_AUTOMATION_READY == 'true' &&
      (
        github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(vars.FOUNDATION_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 90
    steps:
      - name: Check out protected workflow source
        uses: actions/checkout@v7.0.1
        with:
          path: trusted
          fetch-depth: 0

      - name: Check out requested OP00 revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: request
          fetch-depth: 0

      - name: Validate the focused OP00 request
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/request"
          jq -e '
            .contract_version == 1 and .enabled == true
          ' op00_manage_global_landing_zone/operation.json >/dev/null
          mapfile -t changed_files < <(
            if [ "$BASE_SHA" = \
              "0000000000000000000000000000000000000000" ]; then
              git ls-tree -r --name-only "$HEAD_SHA"
            else
              git diff --name-only "$BASE_SHA" "$HEAD_SHA"
            fi
          )
          for path in "${changed_files[@]}"; do
            case "$path" in
              config/customer.jsonnet|\
              op00_manage_global_landing_zone/operation.json|\
              op00_manage_global_landing_zone/generated/*.json)
                ;;
              *)
                echo "OP00 must be a focused phase PR: $path" >&2
                exit 1
                ;;
            esac
            test "$(git ls-tree "$HEAD_SHA" -- "$path" | awk '{print $1}')" = \
              "100644"
          done
          test -f op00_manage_global_landing_zone/generated/iam.json
          jq -e '
            keys == [
              "identity_domain_groups_configuration",
              "identity_domains_configuration",
              "policies_configuration"
            ]
          ' op00_manage_global_landing_zone/generated/iam.json >/dev/null

      - name: Fetch the pinned Orchestrator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/ORCH"
          git init --quiet "$GITHUB_WORKSPACE/ORCH"
          git -C "$GITHUB_WORKSPACE/ORCH" remote add origin \
            https://github.com/oci-landing-zones/terraform-oci-modules-orchestrator.git
          git -C "$GITHUB_WORKSPACE/ORCH" fetch --quiet --depth 1 \
            origin "$ORCHESTRATOR_REVISION"
          git -C "$GITHUB_WORKSPACE/ORCH" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/ORCH" rev-parse HEAD)" = \
            "$ORCHESTRATOR_REVISION"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: true

      - name: Configure Instance Principal and OP00 state
        shell: bash
        env:
          STATE_BUCKET: ${{ vars.OCI_TF_STATE_BUCKET }}
          STATE_NAMESPACE: ${{ vars.OCI_TF_STATE_NAMESPACE }}
          STATE_REGION: ${{ vars.REGION }}
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
        run: |
          set -euo pipefail
          for variable in \
            STATE_BUCKET STATE_NAMESPACE STATE_REGION TENANCY_OCID
          do
            test -n "${!variable}" || {
              echo "Required repository variable is empty: $variable" >&2
              exit 1
            }
          done
          cat > "$GITHUB_WORKSPACE/ORCH/providers.tf" <<EOF
          data "oci_identity_regions" "these" {}
          data "oci_identity_tenancy" "this" {
            tenancy_id = var.tenancy_ocid
          }
          locals {
            regions_map = {
              for r in data.oci_identity_regions.these.regions : r.key => r.name
            }
            regions_map_reverse = {
              for r in data.oci_identity_regions.these.regions : r.name => r.key
            }
            home_region_key = data.oci_identity_tenancy.this.home_region_key
            region_key      = lower(local.regions_map_reverse[var.region])
          }
          provider "oci" {
            auth   = "InstancePrincipal"
            region = var.region
          }
          provider "oci" {
            auth   = "InstancePrincipal"
            alias  = "home"
            region = local.regions_map[local.home_region_key]
          }
          provider "oci" {
            auth   = "InstancePrincipal"
            alias  = "secondary_region"
            region = var.region
          }
          terraform {
            required_version = ">= 1.5.0"
            required_providers {
              oci = {
                source                = "oracle/oci"
                configuration_aliases = [oci.home]
              }
            }
            backend "oci" {
              bucket    = "$STATE_BUCKET"
              namespace = "$STATE_NAMESPACE"
              auth      = "InstancePrincipal"
              region    = "$STATE_REGION"
              key       = "$STATE_KEY"
            }
          }
          EOF
          jq -n \
            --arg tenancy_ocid "$TENANCY_OCID" \
            --arg region "$STATE_REGION" \
            '{tenancy_ocid: $tenancy_ocid, region: $region}' \
            > "$RUNNER_TEMP/oci-credentials.tfvars.json"

      - name: Initialize and plan OP00
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" init \
            -input=false -no-color
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" validate -no-color
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" plan \
            -input=false -no-color \
            -var-file="$RUNNER_TEMP/oci-credentials.tfvars.json" \
            -var-file="$GITHUB_WORKSPACE/request/op00_manage_global_landing_zone/generated/iam.json" \
            -var="output_path=$RUNNER_TEMP/op00-output" \
            -out="$RUNNER_TEMP/op00.tfplan"

      - name: Apply the same OP00 plan after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" apply \
            -input=false -no-color -auto-approve "$RUNNER_TEMP/op00.tfplan"
