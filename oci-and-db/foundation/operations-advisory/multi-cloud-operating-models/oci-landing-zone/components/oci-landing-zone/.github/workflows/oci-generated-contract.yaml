name: OCI generated phase contract

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'config/customer.jsonnet'
      - 'op00_manage_global_landing_zone/generated/**'
      - 'op00_manage_global_landing_zone/operation.json'
      - 'op01_manage_landing_zone_environment/generated/**'
      - 'op01_manage_landing_zone_environment/operation.json'
      - 'op02_manage_environment/*/generated/**'
      - 'op02_manage_environment/*/operation.json'
  push:
    branches: [main]
    paths:
      - 'config/customer.jsonnet'
      - 'op00_manage_global_landing_zone/generated/**'
      - 'op00_manage_global_landing_zone/operation.json'
      - 'op01_manage_landing_zone_environment/generated/**'
      - 'op01_manage_landing_zone_environment/operation.json'
      - 'op02_manage_environment/*/generated/**'
      - 'op02_manage_environment/*/operation.json'

permissions:
  contents: read

env:
  OE_REVISION: 172809932c53467ab20ec6d1b44290a487211b36

jobs:
  generated-contract:
    name: Regenerate each changed OP00-OP02 projection
    if: >-
      vars.FOUNDATION_AUTOMATION_READY == 'true' &&
      (
        github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(vars.FOUNDATION_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 20
    steps:
      - name: Check out protected generator
        uses: actions/checkout@v7.0.1
        with:
          path: trusted
          fetch-depth: 0

      - name: Check out requested revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: request
          fetch-depth: 0

      - name: Resolve changed projection roots
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/request"
          mapfile -t changed_files < <(
            if [ "$BASE_SHA" = \
              "0000000000000000000000000000000000000000" ]; then
              git ls-tree -r --name-only "$HEAD_SHA"
            else
              git diff --name-only "$BASE_SHA" "$HEAD_SHA"
            fi
          )
          test "${#changed_files[@]}" -gt 0

          roots_file="$RUNNER_TEMP/changed-projection-roots"
          : > "$roots_file"
          config_changed=false
          for path in "${changed_files[@]}"; do
            case "$path" in
              config/customer.jsonnet)
                config_changed=true
                ;;
              op00_manage_global_landing_zone/operation.json)
                jq -e '
                  .contract_version == 1 and
                  (.enabled | type == "boolean")
                ' "$path" >/dev/null
                ;;
              op01_manage_landing_zone_environment/operation.json)
                jq -e '
                  .contract_version == 1 and
                  (.enabled | type == "boolean") and
                  (.stage == "core" or .stage == "pre" or .stage == "final")
                ' "$path" >/dev/null
                ;;
              op02_manage_environment/*/operation.json)
                environment="$(cut -d/ -f2 <<< "$path")"
                jq -e --arg environment "$environment" '
                  .contract_version == 1 and
                  (.enabled | type == "boolean") and
                  .environment == $environment and
                  ($environment | test("^(dev|test|uat|prod)$"))
                ' "$path" >/dev/null
                ;;
              op00_manage_global_landing_zone/generated/*.json)
                echo "op00_manage_global_landing_zone" >> "$roots_file"
                ;;
              op01_manage_landing_zone_environment/generated/*.json)
                echo "op01_manage_landing_zone_environment" >> "$roots_file"
                ;;
              op02_manage_environment/*/generated/*.json)
                cut -d/ -f1-2 <<< "$path" >> "$roots_file"
                ;;
              *)
                echo "Generated-contract PR contains an invalid path: $path" >&2
                exit 1
                ;;
            esac
            test "$(git ls-tree "$HEAD_SHA" -- "$path" | awk '{print $1}')" = \
              "100644"
          done
          sort -u -o "$roots_file" "$roots_file"
          if $config_changed && [ ! -s "$roots_file" ]; then
            echo "A customer-config change must publish at least one phase." >&2
            exit 1
          fi
          if rg -n '__[A-Z0-9_]+__' config/customer.jsonnet; then
            echo "Unresolved customer placeholders remain." >&2
            exit 1
          fi
          echo "roots_file=$roots_file" >> "$GITHUB_OUTPUT"

      - name: Regenerate with the protected adapter and pinned OE release
        shell: bash
        env:
          ROOTS_FILE: ${{ steps.changes.outputs.roots_file }}
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/oe"
          git -C "$RUNNER_TEMP/oe" remote add origin \
            https://github.com/oci-landing-zones/oci-landing-zone-operating-entities.git
          git -C "$RUNNER_TEMP/oe" fetch --quiet --depth 1 origin "$OE_REVISION"
          git -C "$RUNNER_TEMP/oe" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/oe" rev-parse HEAD)" = "$OE_REVISION"

          mkdir -p "$RUNNER_TEMP/render-config" "$RUNNER_TEMP/regenerated"
          cp "$GITHUB_WORKSPACE/trusted/config/render.jsonnet" \
            "$RUNNER_TEMP/render-config/render.jsonnet"
          cp "$GITHUB_WORKSPACE/trusted/config/render.libsonnet" \
            "$RUNNER_TEMP/render-config/render.libsonnet"
          cp "$GITHUB_WORKSPACE/request/config/customer.jsonnet" \
            "$RUNNER_TEMP/render-config/customer.jsonnet"
          cp "$GITHUB_WORKSPACE/request/config/projects.json" \
            "$RUNNER_TEMP/render-config/projects.json"
          mapfile -t environments < <(
            cd "$RUNNER_TEMP/render-config"
            jsonnet -e '
              std.objectFields(
                (import "customer.jsonnet").blueprint.environments
              )
            ' | jq -r '.[]'
          )
          mkdir -p \
            "$RUNNER_TEMP/regenerated/op00_manage_global_landing_zone/generated" \
            "$RUNNER_TEMP/regenerated/op01_manage_landing_zone_environment/generated"
          for environment in "${environments[@]}"; do
            mkdir -p \
              "$RUNNER_TEMP/regenerated/op02_manage_environment/$environment/generated"
            while IFS= read -r project; do
              mkdir -p \
                "$RUNNER_TEMP/regenerated/op04_manage_project/$environment/$environment-$project/generated"
            done < <(jq -r --arg environment "$environment" \
              '.[$environment][]' \
              "$RUNNER_TEMP/render-config/projects.json")
          done
          jsonnet -J "$RUNNER_TEMP/oe/gen" \
            --multi "$RUNNER_TEMP/regenerated" \
            "$RUNNER_TEMP/render-config/render.jsonnet"

          while IFS= read -r root; do
            diff -ru \
              "$RUNNER_TEMP/regenerated/$root/generated" \
              "$GITHUB_WORKSPACE/request/$root/generated"
          done < "$ROOTS_FILE"
