name: OCI OP04 project foundation

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'config/projects.json'
      - 'op04_manage_project/*/*/generated/**'
  push:
    branches: [main]
    paths:
      - 'config/projects.json'
      - 'op04_manage_project/*/*/generated/**'

permissions:
  contents: read

env:
  OE_REVISION: 172809932c53467ab20ec6d1b44290a487211b36
  ORCHESTRATOR_REVISION: fcf1d7f02c0b4faa1ff55f1776c396452dd51761

jobs:
  project:
    name: Plan and apply one OP04 project
    if: >-
      vars.FOUNDATION_AUTOMATION_READY == 'true' &&
      (
        github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(vars.FOUNDATION_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 90
    outputs:
      target_project: ${{ steps.target.outputs.project }}
      operation: ${{ steps.target.outputs.operation }}
    steps:
      - name: Check out protected workflow and generator
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 0

      - name: Check out requested OP04 revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: request
          fetch-depth: 0

      - name: Resolve one project declaration, maintenance update, or retirement
        id: target
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/request"
          mapfile -t changed_files < <(
            if [ "$BASE_SHA" = \
              "0000000000000000000000000000000000000000" ]; then
              git ls-tree -r --name-only "$HEAD_SHA"
            else
              git diff --name-only "$BASE_SHA" "$HEAD_SHA"
            fi
          )
          mapfile -t targets < <(
            printf '%s\n' "${changed_files[@]}" |
              awk -F/ '
                $1 == "op04_manage_project" &&
                $4 == "generated" &&
                ($5 == "iam.json" ||
                 $5 == "project-security-zone-exception.json") &&
                NF == 5 {
                  print $1 "/" $2 "/" $3
                }
              ' | sort -u
          )
          test "${#targets[@]}" -eq 1
          root="${targets[0]}"
          environment="$(cut -d/ -f2 <<< "$root")"
          project="$(cut -d/ -f3 <<< "$root")"
          [[ "$environment" =~ ^(dev|test|uat|prod)$ ]]
          [[ "$project" =~ ^(dev|test|uat|prod)-([a-z][a-z0-9]*(-[a-z0-9]+)*)$ ]]
          test "${BASH_REMATCH[1]}" = "$environment"
          project_name="${BASH_REMATCH[2]}"
          test "${#project_name}" -le 30
          for path in "${changed_files[@]}"; do
            case "$path" in
              config/projects.json|"$root/generated/iam.json"|"$root/generated/project-security-zone-exception.json")
                ;;
              *)
                echo "OP04 accepts changes for exactly one project: $path" >&2
                exit 1
                ;;
            esac
          done
          jq -e '
            keys == ["dev", "prod", "test", "uat"] and
            all(.[]; type == "array") and
            all(.[][];
              test("^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$") and
              length <= 30
            ) and
            all(.[]; length == (unique | length))
          ' config/projects.json >/dev/null
          case "${#changed_files[@]}" in
            1|2)
              for path in "${changed_files[@]}"; do
                test "$(git ls-tree "$HEAD_SHA" -- "$path" | \
                  awk '{print $1}')" = "100644"
              done
              git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
                config/projects.json
              jq -e \
                --arg environment "$environment" \
                --arg project "$project_name" \
                '.[$environment] | index($project) != null' \
                config/projects.json >/dev/null
              operation="maintenance"
              ;;
            3)
              printf '%s\n' "${changed_files[@]}" | sort | diff -u - \
                <(printf '%s\n' \
                  "config/projects.json" \
                  "$root/generated/iam.json" \
                  "$root/generated/project-security-zone-exception.json" | sort)
              git show "$BASE_SHA:config/projects.json" \
                > "$RUNNER_TEMP/projects-before.json"
              jq -n \
                --slurpfile before "$RUNNER_TEMP/projects-before.json" \
                --slurpfile after config/projects.json \
                --arg environment "$environment" \
                --arg project "$project_name" '
                  {
                    added: ($after[0][$environment] - $before[0][$environment]),
                    removed: ($before[0][$environment] - $after[0][$environment]),
                    other_environments_unchanged: all(
                      ["dev", "test", "uat", "prod"][] |
                      select(. != $environment);
                      $after[0][.] == $before[0][.]
                    )
                  }
                ' > "$RUNNER_TEMP/project-change.json"
              if jq -e --arg project "$project_name" '
                .added == [$project] and
                .removed == [] and
                .other_environments_unchanged
              ' "$RUNNER_TEMP/project-change.json" >/dev/null; then
                for path in "${changed_files[@]}"; do
                  test "$(git ls-tree "$HEAD_SHA" -- "$path" | \
                    awk '{print $1}')" = "100644"
                done
                operation="onboarding"
              elif jq -e --arg project "$project_name" '
                .added == [] and
                .removed == [$project] and
                .other_environments_unchanged
              ' "$RUNNER_TEMP/project-change.json" >/dev/null; then
                test "$(git ls-tree "$HEAD_SHA" -- config/projects.json | \
                  awk '{print $1}')" = "100644"
                for path in \
                  "$root/generated/iam.json" \
                  "$root/generated/project-security-zone-exception.json"
                do
                  test "$(git ls-tree "$BASE_SHA" -- "$path" | \
                    awk '{print $1}')" = "100644"
                  test -z "$(git ls-tree "$HEAD_SHA" -- "$path")"
                done
                operation="retirement"
              else
                echo "OP04 three-file changes must add or retire exactly one project." >&2
                exit 1
              fi
              ;;
            *)
              echo "OP04 accepts one or two maintenance artifacts, one three-file addition, or one three-file retirement." >&2
              exit 1
              ;;
          esac
          {
            echo "environment=$environment"
            echo "project=$project"
            echo "project_name=$project_name"
            echo "root=$root"
            echo "state_key=$root/terraform.tfstate"
            echo "operation=$operation"
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate OP04 from pinned OE
        shell: bash
        env:
          OP04_ROOT: ${{ steps.target.outputs.root }}
          OPERATION: ${{ steps.target.outputs.operation }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/oe"
          git -C "$RUNNER_TEMP/oe" remote add origin \
            https://github.com/oci-landing-zones/oci-landing-zone-operating-entities.git
          git -C "$RUNNER_TEMP/oe" fetch --quiet --depth 1 \
            origin "$OE_REVISION"
          git -C "$RUNNER_TEMP/oe" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/oe" rev-parse HEAD)" = "$OE_REVISION"
          render_config="$RUNNER_TEMP/render-config"
          regenerated="$RUNNER_TEMP/regenerated"
          mkdir -p "$render_config" "$regenerated/$OP04_ROOT/generated"
          cp "$GITHUB_WORKSPACE/trusted/config/render.jsonnet" \
            "$render_config/render.jsonnet"
          cp "$GITHUB_WORKSPACE/trusted/config/render.libsonnet" \
            "$render_config/render.libsonnet"
          cp "$GITHUB_WORKSPACE/request/config/customer.jsonnet" \
            "$render_config/customer.jsonnet"
          if [ "$OPERATION" = "retirement" ]; then
            git -C "$GITHUB_WORKSPACE/request" show \
              "$BASE_SHA:config/projects.json" \
              > "$render_config/projects.json"
            git -C "$GITHUB_WORKSPACE/request" show \
              "$BASE_SHA:$OP04_ROOT/generated/iam.json" \
              > "$RUNNER_TEMP/base-op04-iam.json"
            git -C "$GITHUB_WORKSPACE/request" show \
              "$BASE_SHA:$OP04_ROOT/generated/project-security-zone-exception.json" \
              > "$RUNNER_TEMP/base-project-security-zone-exception.json"
            iam_input="$RUNNER_TEMP/base-op04-iam.json"
            exception_input="$RUNNER_TEMP/base-project-security-zone-exception.json"
          else
            cp "$GITHUB_WORKSPACE/request/config/projects.json" \
              "$render_config/projects.json"
            iam_input="$GITHUB_WORKSPACE/request/$OP04_ROOT/generated/iam.json"
            exception_input="$GITHUB_WORKSPACE/request/$OP04_ROOT/generated/project-security-zone-exception.json"
          fi
          mapfile -t environments < <(
            cd "$render_config"
            jsonnet -e '
              std.objectFields(
                (import "customer.jsonnet").blueprint.environments
              )
            ' | jq -r '.[]'
          )
          mkdir -p \
            "$regenerated/op00_manage_global_landing_zone/generated" \
            "$regenerated/op01_manage_landing_zone_environment/generated"
          for environment in "${environments[@]}"; do
            mkdir -p \
              "$regenerated/op02_manage_environment/$environment/generated"
            while IFS= read -r project_name; do
              mkdir -p \
                "$regenerated/op04_manage_project/$environment/$environment-$project_name/generated"
            done < <(jq -r --arg environment "$environment" \
              '.[$environment][]' "$render_config/projects.json")
          done
          jsonnet -J "$RUNNER_TEMP/oe/gen" \
            --multi "$regenerated" "$render_config/render.jsonnet"
          diff -u \
            "$regenerated/$OP04_ROOT/generated/iam.json" \
            "$iam_input"
          diff -u \
            "$regenerated/$OP04_ROOT/generated/project-security-zone-exception.json" \
            "$exception_input"
          jq -e '
            keys == [
              "compartments_configuration",
              "identity_domain_groups_configuration",
              "policies_configuration"
            ]
          ' "$iam_input" >/dev/null
          jq -e '
            keys == [
              "environment_compartment_key",
              "environment_security_zone_display_name",
              "project_compartment_key",
              "schema_version"
            ] and
            .schema_version == 2 and
            all(
              [
                .environment_compartment_key,
                .environment_security_zone_display_name,
                .project_compartment_key
              ][];
              type == "string" and length > 0
            )
          ' "$exception_input" >/dev/null
          jq -e --slurpfile exception \
            "$exception_input" '
              .compartments_configuration.compartments |
              keys == [$exception[0].project_compartment_key]
            ' "$iam_input" >/dev/null
          if rg -n '__[A-Za-z0-9_]+__' \
            "$iam_input" "$exception_input"; then
            echo "Unresolved OP04 placeholder." >&2
            exit 1
          fi
          cp "$iam_input" "$RUNNER_TEMP/op04-iam.json"

      - name: Fetch the pinned Orchestrator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/ORCH"
          git init --quiet "$GITHUB_WORKSPACE/ORCH"
          git -C "$GITHUB_WORKSPACE/ORCH" remote add origin \
            https://github.com/oci-landing-zones/terraform-oci-modules-orchestrator.git
          git -C "$GITHUB_WORKSPACE/ORCH" fetch --quiet --depth 1 \
            origin "$ORCHESTRATOR_REVISION"
          git -C "$GITHUB_WORKSPACE/ORCH" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/ORCH" rev-parse HEAD)" = \
            "$ORCHESTRATOR_REVISION"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Load OP00 and OP02 dependencies
        shell: bash
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          STATE_BUCKET: ${{ vars.OCI_TF_STATE_BUCKET }}
          STATE_NAMESPACE: ${{ vars.OCI_TF_STATE_NAMESPACE }}
          STATE_REGION: ${{ vars.REGION }}
        run: |
          set -euo pipefail
          dependency_root="$RUNNER_TEMP/foundation-dependencies"
          for phase in op00 op02; do
            mkdir -p "$dependency_root/$phase"
            cat > "$dependency_root/$phase/backend.tf" <<'EOF'
          terraform {
            backend "oci" {}
          }
          EOF
          done
          terraform -chdir="$dependency_root/op00" init \
            -input=false -no-color \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="namespace=$STATE_NAMESPACE" \
            -backend-config="region=$STATE_REGION" \
            -backend-config="auth=InstancePrincipal" \
            -backend-config="key=op00_manage_global_landing_zone/terraform.tfstate"
          terraform -chdir="$dependency_root/op02" init \
            -input=false -no-color \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="namespace=$STATE_NAMESPACE" \
            -backend-config="region=$STATE_REGION" \
            -backend-config="auth=InstancePrincipal" \
            -backend-config="key=op02_manage_environment/$ENVIRONMENT/terraform.tfstate"
          op00_state="$dependency_root/op00/terraform.tfstate.json"
          op02_state="$dependency_root/op02/terraform.tfstate.json"
          terraform -chdir="$dependency_root/op00" state pull > "$op00_state"
          terraform -chdir="$dependency_root/op02" state pull > "$op02_state"
          extract_dependency() {
            local state_file="$1"
            local resource_name="$2"
            local output_file="$3"
            jq -er --arg resource_name "$resource_name" '
              [
                .resources[]? |
                select(
                  .type == "local_file" and
                  .name == $resource_name
                ) |
                .instances[]?.attributes.content
              ] |
              if length == 1 then
                .[0] | fromjson
              else
                error(
                  "Expected exactly one Orchestrator dependency artifact"
                )
              end
            ' "$state_file" > "$output_file"
          }
          extract_dependency \
            "$op00_state" \
            identity_domains_output \
            "$RUNNER_TEMP/identity-domains-dependency.json"
          extract_dependency \
            "$op02_state" \
            compartments_output \
            "$RUNNER_TEMP/compartments-dependency.json"
          jq -n \
            --arg identity_domains \
              "$RUNNER_TEMP/identity-domains-dependency.json" \
            --arg compartments \
              "$RUNNER_TEMP/compartments-dependency.json" \
            '{
              identity_domains_dependency: $identity_domains,
              compartments_dependency: $compartments
            }' > "$RUNNER_TEMP/op04-dependencies.tfvars.json"

      - name: Configure Instance Principal and OP04 state
        shell: bash
        env:
          STATE_BUCKET: ${{ vars.OCI_TF_STATE_BUCKET }}
          STATE_NAMESPACE: ${{ vars.OCI_TF_STATE_NAMESPACE }}
          STATE_REGION: ${{ vars.REGION }}
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          STATE_KEY: ${{ steps.target.outputs.state_key }}
        run: |
          set -euo pipefail
          for variable in \
            STATE_BUCKET STATE_NAMESPACE STATE_REGION TENANCY_OCID STATE_KEY
          do
            test -n "${!variable}" || {
              echo "Required repository variable is empty: $variable" >&2
              exit 1
            }
          done
          cat > "$GITHUB_WORKSPACE/ORCH/providers.tf" <<EOF
          data "oci_identity_regions" "these" {}
          data "oci_identity_tenancy" "this" {
            tenancy_id = var.tenancy_ocid
          }
          locals {
            regions_map = {
              for r in data.oci_identity_regions.these.regions : r.key => r.name
            }
            regions_map_reverse = {
              for r in data.oci_identity_regions.these.regions : r.name => r.key
            }
            home_region_key = data.oci_identity_tenancy.this.home_region_key
            region_key      = lower(local.regions_map_reverse[var.region])
          }
          provider "oci" {
            auth   = "InstancePrincipal"
            region = var.region
            ignore_defined_tags = [
              "Oracle-Tags.CreatedBy",
              "Oracle-Tags.CreatedOn",
            ]
          }
          provider "oci" {
            auth   = "InstancePrincipal"
            alias  = "home"
            region = local.regions_map[local.home_region_key]
            ignore_defined_tags = [
              "Oracle-Tags.CreatedBy",
              "Oracle-Tags.CreatedOn",
            ]
          }
          provider "oci" {
            auth   = "InstancePrincipal"
            alias  = "secondary_region"
            region = var.region
            ignore_defined_tags = [
              "Oracle-Tags.CreatedBy",
              "Oracle-Tags.CreatedOn",
            ]
          }
          terraform {
            required_version = ">= 1.5.0"
            required_providers {
              oci = {
                source                = "oracle/oci"
                configuration_aliases = [oci.home]
              }
            }
            backend "oci" {
              bucket    = "$STATE_BUCKET"
              namespace = "$STATE_NAMESPACE"
              auth      = "InstancePrincipal"
              region    = "$STATE_REGION"
              key       = "$STATE_KEY"
            }
          }
          EOF
          jq -n \
            --arg tenancy_ocid "$TENANCY_OCID" \
            --arg region "$STATE_REGION" \
            '{tenancy_ocid: $tenancy_ocid, region: $region}' \
            > "$RUNNER_TEMP/oci-credentials.tfvars.json"

      - name: Initialize and plan OP04
        shell: bash
        env:
          OPERATION: ${{ steps.target.outputs.operation }}
        run: |
          set -euo pipefail
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" init \
            -input=false -no-color
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" validate -no-color
          plan_args=(
            -input=false -no-color \
            -var-file="$RUNNER_TEMP/oci-credentials.tfvars.json" \
            -var-file="$RUNNER_TEMP/op04-dependencies.tfvars.json" \
            -var-file="$RUNNER_TEMP/op04-iam.json" \
            -var="output_path=$RUNNER_TEMP/op04-output" \
            -out="$RUNNER_TEMP/op04.tfplan"
          )
          if [ "$OPERATION" = "retirement" ]; then
            plan_args+=(-destroy)
          fi
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" plan \
            "${plan_args[@]}"

      - name: Preview delegated project Security Zone exception
        if: >-
          github.event_name == 'pull_request_target' &&
          steps.target.outputs.operation != 'retirement'
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Project Security Zone exception: pending post-merge removal for the delegated project compartment.
          EOF

      - name: Preview OP04 project retirement
        if: >-
          github.event_name == 'pull_request_target' &&
          steps.target.outputs.operation == 'retirement'
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Project retirement: the reviewed Terraform destroy plan targets only this project's isolated OP04 state.
          EOF

      - name: Remove the detached Cloud Guard Target before retirement
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.target.outputs.operation == 'retirement'
        shell: bash
        env:
          OP04_ROOT: ${{ steps.target.outputs.root }}
          OCI_CLI_AUTH: instance_principal
          OCI_CLI_REGION: ${{ vars.REGION }}
        run: |
          set -euo pipefail
          exception_file="$RUNNER_TEMP/base-project-security-zone-exception.json"
          project_compartment_key="$(jq -er '.project_compartment_key' "$exception_file")"
          project_output="$(
            terraform -chdir="$GITHUB_WORKSPACE/ORCH" output -json iam_resources
          )"
          project_compartment_id="$(jq -er \
            --arg key "$project_compartment_key" \
            '.compartments[$key].id' \
            <<< "$project_output")"
          resources="$(
            oci search resource structured-search \
              --query-text "query all resources where compartmentId = '$project_compartment_id'" \
              --limit 1000
          )"
          mapfile -t target_ids < <(
            jq -r '
              .data.items[]? |
              select(.["resource-type"] == "CloudGuardTarget") |
              .identifier
            ' <<< "$resources"
          )
          case "${#target_ids[@]}" in
            0)
              echo "Project retirement Cloud Guard Target: absent." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              target="$(
                oci cloud-guard target get --target-id "${target_ids[0]}"
              )"
              jq -e --arg project_compartment_id "$project_compartment_id" '
                .data["target-resource-id"] == $project_compartment_id and
                .data["target-resource-type"] == "COMPARTMENT" and
                .data["compartment-id"] == $project_compartment_id and
                .data["lifecycle-state"] == "ACTIVE"
              ' <<< "$target" >/dev/null
              oci cloud-guard target delete \
                --target-id "${target_ids[0]}" \
                --force \
                --wait-for-state DELETED
              echo "Project retirement Cloud Guard Target: removed." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Expected at most one Cloud Guard Target for the retiring project compartment." >&2
              exit 1
              ;;
          esac

      - name: Apply the same OP04 plan after merge
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" apply \
            -input=false -no-color -auto-approve "$RUNNER_TEMP/op04.tfplan"

      - name: Resolve delegated project Security Zone exception
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.target.outputs.operation != 'retirement'
        shell: bash
        env:
          OP04_ROOT: ${{ steps.target.outputs.root }}
          OCI_CLI_AUTH: instance_principal
          OCI_CLI_REGION: ${{ vars.REGION }}
        run: |
          set -euo pipefail
          exception_file="$GITHUB_WORKSPACE/request/$OP04_ROOT/generated/project-security-zone-exception.json"
          project_compartment_key="$(jq -er '.project_compartment_key' "$exception_file")"
          environment_key="$(jq -er '.environment_compartment_key' "$exception_file")"
          environment_zone_name="$(jq -er '.environment_security_zone_display_name' "$exception_file")"
          project_output="$(
            terraform -chdir="$GITHUB_WORKSPACE/ORCH" output -json \
              iam_resources
          )"
          project_compartment_id="$(jq -er \
            --arg key "$project_compartment_key" \
            '.compartments[$key].id' \
            <<< "$project_output")"
          environment_compartment_id="$(jq -er \
            --arg key "$environment_key" \
            '.compartments[$key].id' \
            "$RUNNER_TEMP/compartments-dependency.json")"
          zones="$(
            oci cloud-guard security-zone-collection list-security-zones \
              --compartment-id "$environment_compartment_id" \
              --display-name "$environment_zone_name" \
              --lifecycle-state ACTIVE \
              --all
          )"
          zone_id="$(jq -er \
            --arg display_name "$environment_zone_name" \
            --arg compartment_id "$environment_compartment_id" '
              [
                .data.items[]? |
                select(
                  .["display-name"] == $display_name and
                  .["compartment-id"] == $compartment_id and
                  .["lifecycle-state"] == "ACTIVE"
                ) |
                .id
              ] |
              if length == 1 then .[0]
              else error("Expected exactly one active environment Security Zone")
              end
            ' <<< "$zones")"
          zone="$(
            oci cloud-guard security-zone get --security-zone-id "$zone_id"
          )"
          if jq -e --arg id "$project_compartment_id" \
            '.data["inherited-by-compartments"] | index($id) != null' \
            <<< "$zone" >/dev/null; then
            oci cloud-guard security-zone remove \
              --security-zone-id "$zone_id" \
              --compartment-id "$project_compartment_id"
            result="applied"
          else
            result="already present"
          fi
          for attempt in {1..24}; do
            verified_zone="$(
              oci cloud-guard security-zone get --security-zone-id "$zone_id"
            )"
            if ! jq -e --arg id "$project_compartment_id" \
              '.data["inherited-by-compartments"] | index($id) != null' \
              <<< "$verified_zone" >/dev/null; then
              printf 'Project Security Zone exception: %s.\n' "$result" \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 24 ]; then
              sleep 5
            fi
          done
          echo "Security Zone inheritance did not converge." >&2
          exit 1

  handoff:
    name: Generate project handoff after OP04
    needs: project
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.project.outputs.operation != 'retirement'
    permissions:
      contents: read
    uses: ./.github/workflows/oci-project-handoff.yaml
    with:
      project: ${{ needs.project.outputs.target_project }}
