name: OCI OP04 project foundation

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'op04_manage_project/*/*/iam.json'
  push:
    branches: [main]
    paths:
      - 'op04_manage_project/*/*/iam.json'

permissions:
  contents: read

env:
  ORCHESTRATOR_REVISION: fcf1d7f02c0b4faa1ff55f1776c396452dd51761

jobs:
  project:
    name: Plan and apply one OP04 project
    if: >-
      vars.FOUNDATION_AUTOMATION_READY == 'true' &&
      (
        github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(vars.FOUNDATION_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 90
    outputs:
      target_project: ${{ steps.target.outputs.project }}
      operation: ${{ steps.target.outputs.operation }}
    steps:
      - name: Check out requested OP04 revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: request
          fetch-depth: 0

      - name: Resolve one editable OP04 project change
        id: target
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/request"
          mapfile -t changed_files < <(
            if [ "$BASE_SHA" = \
              "0000000000000000000000000000000000000000" ]; then
              git ls-tree -r --name-only "$HEAD_SHA"
            else
              git diff --name-only "$BASE_SHA" "$HEAD_SHA"
            fi
          )
          mapfile -t targets < <(
            printf '%s\n' "${changed_files[@]}" |
              awk -F/ '
                $1 == "op04_manage_project" &&
                $4 == "iam.json" &&
                NF == 4 {
                  print $1 "/" $2 "/" $3
                }
              ' | sort -u
          )
          test "${#targets[@]}" -eq 1
          root="${targets[0]}"
          environment="$(cut -d/ -f2 <<< "$root")"
          project="$(cut -d/ -f3 <<< "$root")"
          [[ "$environment" =~ ^(dev|test|uat|prod)$ ]]
          [[ "$project" =~ ^(dev|test|uat|prod)-([a-z][a-z0-9]*(-[a-z0-9]+)*)$ ]]
          test "${BASH_REMATCH[1]}" = "$environment"
          project_name="${BASH_REMATCH[2]}"
          test "${#project_name}" -le 30
          test "${#changed_files[@]}" -eq 1
          path="${changed_files[0]}"
          test "$path" = "$root/iam.json"
          head_mode="$(git ls-tree "$HEAD_SHA" -- "$path" | awk '{print $1}')"
          base_mode="$(git ls-tree "$BASE_SHA" -- "$path" | awk '{print $1}')"
          if [ "$head_mode" = "100644" ]; then
            if [ -z "$base_mode" ]; then
              operation="onboarding"
            else
              test "$base_mode" = "100644"
              operation="maintenance"
            fi
          else
            test -z "$head_mode"
            test "$base_mode" = "100644"
            operation="retirement"
          fi
          {
            echo "environment=$environment"
            echo "project=$project"
            echo "project_name=$project_name"
            echo "root=$root"
            echo "state_key=$root/terraform.tfstate"
            echo "operation=$operation"
          } >> "$GITHUB_OUTPUT"

      - name: Validate the editable OP04 IAM input
        shell: bash
        env:
          OP04_ROOT: ${{ steps.target.outputs.root }}
          OPERATION: ${{ steps.target.outputs.operation }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = "retirement" ]; then
            git -C "$GITHUB_WORKSPACE/request" show \
              "$BASE_SHA:$OP04_ROOT/iam.json" \
              > "$RUNNER_TEMP/base-op04-iam.json"
            iam_input="$RUNNER_TEMP/base-op04-iam.json"
          else
            iam_input="$GITHUB_WORKSPACE/request/$OP04_ROOT/iam.json"
            test -f "$iam_input"
          fi
          jq -e '
            keys == [
              "compartments_configuration",
              "identity_domain_groups_configuration"
            ]
          ' "$iam_input" >/dev/null
          if rg -n '__[A-Za-z0-9_]+__' "$iam_input"; then
            echo "Unresolved OP04 placeholder." >&2
            exit 1
          fi
          cp "$iam_input" "$RUNNER_TEMP/op04-iam.json"

      - name: Fetch the pinned Orchestrator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/ORCH"
          git init --quiet "$GITHUB_WORKSPACE/ORCH"
          git -C "$GITHUB_WORKSPACE/ORCH" remote add origin \
            https://github.com/oci-landing-zones/terraform-oci-modules-orchestrator.git
          git -C "$GITHUB_WORKSPACE/ORCH" fetch --quiet --depth 1 \
            origin "$ORCHESTRATOR_REVISION"
          git -C "$GITHUB_WORKSPACE/ORCH" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/ORCH" rev-parse HEAD)" = \
            "$ORCHESTRATOR_REVISION"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Load OP00 and OP02 dependencies
        shell: bash
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          STATE_BUCKET: ${{ vars.OCI_TF_STATE_BUCKET }}
          STATE_NAMESPACE: ${{ vars.OCI_TF_STATE_NAMESPACE }}
          STATE_REGION: ${{ vars.REGION }}
        run: |
          set -euo pipefail
          dependency_root="$RUNNER_TEMP/foundation-dependencies"
          for phase in op00 op02; do
            mkdir -p "$dependency_root/$phase"
            cat > "$dependency_root/$phase/backend.tf" <<'EOF'
          terraform {
            backend "oci" {}
          }
          EOF
          done
          terraform -chdir="$dependency_root/op00" init \
            -input=false -no-color \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="namespace=$STATE_NAMESPACE" \
            -backend-config="region=$STATE_REGION" \
            -backend-config="auth=InstancePrincipal" \
            -backend-config="key=op00_manage_global_landing_zone/terraform.tfstate"
          terraform -chdir="$dependency_root/op02" init \
            -input=false -no-color \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="namespace=$STATE_NAMESPACE" \
            -backend-config="region=$STATE_REGION" \
            -backend-config="auth=InstancePrincipal" \
            -backend-config="key=op02_manage_environment/$ENVIRONMENT/terraform.tfstate"
          op00_state="$dependency_root/op00/terraform.tfstate.json"
          op02_state="$dependency_root/op02/terraform.tfstate.json"
          terraform -chdir="$dependency_root/op00" state pull > "$op00_state"
          terraform -chdir="$dependency_root/op02" state pull > "$op02_state"
          extract_dependency() {
            local state_file="$1"
            local resource_name="$2"
            local output_file="$3"
            jq -er --arg resource_name "$resource_name" '
              [
                .resources[]? |
                select(
                  .type == "local_file" and
                  .name == $resource_name
                ) |
                .instances[]?.attributes.content
              ] |
              if length == 1 then
                .[0] | fromjson
              else
                error(
                  "Expected exactly one Orchestrator dependency artifact"
                )
              end
            ' "$state_file" > "$output_file"
          }
          extract_dependency \
            "$op00_state" \
            identity_domains_output \
            "$RUNNER_TEMP/identity-domains-dependency.json"
          extract_dependency \
            "$op02_state" \
            compartments_output \
            "$RUNNER_TEMP/compartments-dependency.json"
          jq -n \
            --arg identity_domains \
              "$RUNNER_TEMP/identity-domains-dependency.json" \
            --arg compartments \
              "$RUNNER_TEMP/compartments-dependency.json" \
            '{
              identity_domains_dependency: $identity_domains,
              compartments_dependency: $compartments
            }' > "$RUNNER_TEMP/op04-dependencies.tfvars.json"

      - name: Configure Instance Principal and OP04 state
        shell: bash
        env:
          STATE_BUCKET: ${{ vars.OCI_TF_STATE_BUCKET }}
          STATE_NAMESPACE: ${{ vars.OCI_TF_STATE_NAMESPACE }}
          STATE_REGION: ${{ vars.REGION }}
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          STATE_KEY: ${{ steps.target.outputs.state_key }}
        run: |
          set -euo pipefail
          for variable in \
            STATE_BUCKET STATE_NAMESPACE STATE_REGION TENANCY_OCID STATE_KEY
          do
            test -n "${!variable}" || {
              echo "Required repository variable is empty: $variable" >&2
              exit 1
            }
          done
          cat > "$GITHUB_WORKSPACE/ORCH/providers.tf" <<EOF
          data "oci_identity_regions" "these" {}
          data "oci_identity_tenancy" "this" {
            tenancy_id = var.tenancy_ocid
          }
          locals {
            regions_map = {
              for r in data.oci_identity_regions.these.regions : r.key => r.name
            }
            regions_map_reverse = {
              for r in data.oci_identity_regions.these.regions : r.name => r.key
            }
            home_region_key = data.oci_identity_tenancy.this.home_region_key
            region_key      = lower(local.regions_map_reverse[var.region])
          }
          provider "oci" {
            auth   = "InstancePrincipal"
            region = var.region
            ignore_defined_tags = [
              "Oracle-Tags.CreatedBy",
              "Oracle-Tags.CreatedOn",
            ]
          }
          provider "oci" {
            auth   = "InstancePrincipal"
            alias  = "home"
            region = local.regions_map[local.home_region_key]
            ignore_defined_tags = [
              "Oracle-Tags.CreatedBy",
              "Oracle-Tags.CreatedOn",
            ]
          }
          provider "oci" {
            auth   = "InstancePrincipal"
            alias  = "secondary_region"
            region = var.region
            ignore_defined_tags = [
              "Oracle-Tags.CreatedBy",
              "Oracle-Tags.CreatedOn",
            ]
          }
          terraform {
            required_version = ">= 1.5.0"
            required_providers {
              oci = {
                source                = "oracle/oci"
                configuration_aliases = [oci.home]
              }
            }
            backend "oci" {
              bucket    = "$STATE_BUCKET"
              namespace = "$STATE_NAMESPACE"
              auth      = "InstancePrincipal"
              region    = "$STATE_REGION"
              key       = "$STATE_KEY"
            }
          }
          EOF
          jq -n \
            --arg tenancy_ocid "$TENANCY_OCID" \
            --arg region "$STATE_REGION" \
            '{tenancy_ocid: $tenancy_ocid, region: $region}' \
            > "$RUNNER_TEMP/oci-credentials.tfvars.json"

      - name: Initialize and plan OP04
        shell: bash
        env:
          OPERATION: ${{ steps.target.outputs.operation }}
        run: |
          set -euo pipefail
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" init \
            -input=false -no-color
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" validate -no-color
          plan_args=(
            -input=false -no-color \
            -var-file="$RUNNER_TEMP/oci-credentials.tfvars.json" \
            -var-file="$RUNNER_TEMP/op04-dependencies.tfvars.json" \
            -var-file="$RUNNER_TEMP/op04-iam.json" \
            -var="output_path=$RUNNER_TEMP/op04-output" \
            -out="$RUNNER_TEMP/op04.tfplan"
          )
          if [ "$OPERATION" = "retirement" ]; then
            plan_args+=(-destroy)
          fi
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" plan \
            "${plan_args[@]}"

      - name: Preview OP04 project retirement
        if: >-
          github.event_name == 'pull_request_target' &&
          steps.target.outputs.operation == 'retirement'
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Project retirement: the reviewed Terraform destroy plan targets only this project's isolated OP04 state.
          EOF

      - name: Apply the same OP04 plan after merge
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          terraform -chdir="$GITHUB_WORKSPACE/ORCH" apply \
            -input=false -no-color -parallelism=1 -auto-approve "$RUNNER_TEMP/op04.tfplan"

  handoff:
    name: Generate project handoff after OP04
    needs: project
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.project.outputs.operation != 'retirement'
    permissions:
      contents: read
    uses: ./.github/workflows/oci-project-handoff.yaml
    with:
      project: ${{ needs.project.outputs.target_project }}
