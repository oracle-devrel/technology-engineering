name: OCI Terraform pipeline - OP04 Manage Project

on:
  push:
    branches:
      - main
    paths:
      - 'op04_manage_project/**'
      - '!op04_manage_project/templates/**'
  pull_request:
    branches:
      - main
    paths:
      - 'op04_manage_project/**'
      - '!op04_manage_project/templates/**'
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - test
          - uat
          - prod
      project:
        description: "Canonical project slug under op04_manage_project/<env>/"
        required: true
        default: "prod-project15"

jobs:
  project:
    name: 'op04_manage_project'
    if: vars.FOUNDATION_AUTOMATION_READY == 'true'
    runs-on: self-hosted
    outputs:
      target_env: ${{ steps.target.outputs.target_env }}
      target_project: ${{ steps.target.outputs.target_project }}
    permissions:
      pull-requests: write
      actions: read
      contents: read

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Resolve OP04 target'
        id: target
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_SUBPATH="op04_manage_project/${{ inputs.env }}/${{ inputs.project }}"
          else
            CHANGED_FILE_LIST="$(mktemp)"

            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git diff --name-only \
                "${{ github.event.pull_request.base.sha }}" \
                "${{ github.event.pull_request.head.sha }}" > "$CHANGED_FILE_LIST"
            elif [ "${{ github.event_name }}" = "push" ]; then
              git diff --name-only \
                "${{ github.event.before }}" \
                "${{ github.event.after }}" > "$CHANGED_FILE_LIST"
            else
              find op04_manage_project -type f > "$CHANGED_FILE_LIST"
            fi

            mapfile -t TARGETS < <(
              awk -F/ '$1 == "op04_manage_project" && NF >= 4 {print $1 "/" $2 "/" $3}' "$CHANGED_FILE_LIST" \
                | sort -u
            )

            if [ "${#TARGETS[@]}" -eq 0 ]; then
              echo "No OP04 project directory found in changed files."
              exit 1
            fi

            if [ "${#TARGETS[@]}" -gt 1 ]; then
              echo "OP04 workflow accepts one project per run. Split these changes into separate PRs:"
              printf '  - %s\n' "${TARGETS[@]}"
              exit 1
            fi

            TARGET_SUBPATH="${TARGETS[0]}"
          fi

          if [ ! -d "$TARGET_SUBPATH" ]; then
            echo "OP04 project directory not found: $TARGET_SUBPATH"
            exit 1
          fi

          TARGET_ENV="$(echo "$TARGET_SUBPATH" | cut -d/ -f2)"
          TARGET_PROJECT="$(echo "$TARGET_SUBPATH" | cut -d/ -f3)"
          if [[ ! "$TARGET_PROJECT" =~ ^(dev|test|uat|prod)-([a-z][a-z0-9]*(-[a-z0-9]+)*)$ ]]; then
            echo "Invalid canonical project folder: $TARGET_PROJECT"
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$TARGET_ENV" ]] || \
             [[ "${#BASH_REMATCH[2]}" -gt 30 ]]; then
            echo "Project folder does not match its environment: $TARGET_SUBPATH"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CONTRACT_REF="$BASE_SHA"
          else
            CONTRACT_REF="$CURRENT_SHA"
          fi
          CONTRACT=$(git show "$CONTRACT_REF:.github/project-onboarding-contract.json")
          BLUEPRINT_PATH=$(
            jq -er --arg environment "$TARGET_ENV" '
              select(
                .contract_version == 2 and
                .same_slug_repository == false and
                (.allowed_environments | index($environment)) != null and
                .target_repository_prefixes[$environment] ==
                  (if $environment == "prod" then "prod" else "nonprod" end)
              ) |
              .environment_blueprints[$environment]
            ' <<< "$CONTRACT"
          )
          git cat-file -e "$CONTRACT_REF:$BLUEPRINT_PATH"
          git show "$CONTRACT_REF:$BLUEPRINT_PATH" \
            | jq -e --arg environment "$TARGET_ENV" '
                .schema_version == 2 and .environment == $environment
              ' >/dev/null
          STATE_KEY="$TARGET_SUBPATH/terraform.tfstate"

          {
            echo "target_subpath=$TARGET_SUBPATH"
            echo "target_env=$TARGET_ENV"
            echo "target_project=$TARGET_PROJECT"
            echo "state_key=$STATE_KEY"
          } >> "$GITHUB_OUTPUT"
          {
            echo "OP04_TARGET_SUBPATH=$TARGET_SUBPATH"
            echo "OP04_STATE_KEY=$STATE_KEY"
          } >> "$GITHUB_ENV"

          echo "Resolved OP04 target: $TARGET_SUBPATH"

      - name: 'Clone Orchestrator Module'
        run: git clone https://github.com/oci-landing-zones/terraform-oci-modules-orchestrator.git ORCH && git -C ORCH checkout 34202e837e9df015ddaaa4fce0ab62bb6e3883de

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.1
          terraform_wrapper: true

      - name: 'Setup Orchestrator Instance Principal Auth'
        id: backend
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ vars.OCI_TF_STATE_BUCKET }}" ]; then
            echo "Repository variable OCI_TF_STATE_BUCKET is required."
            exit 1
          fi
          if [ -z "${{ vars.OCI_TF_STATE_NAMESPACE }}" ]; then
            echo "Repository variable OCI_TF_STATE_NAMESPACE is required."
            exit 1
          fi
          if [ -z "${{ vars.REGION }}" ]; then
            echo "Repository variable REGION is required."
            exit 1
          fi

          cat > "${{ github.workspace }}/ORCH/providers.tf" << EOF
          data "oci_identity_regions" "these" {}

          data "oci_identity_tenancy" "this" {
            tenancy_id = var.tenancy_ocid
          }

          locals {
            regions_map         = { for r in data.oci_identity_regions.these.regions : r.key => r.name }
            regions_map_reverse = { for r in data.oci_identity_regions.these.regions : r.name => r.key }
            home_region_key     = data.oci_identity_tenancy.this.home_region_key
            region_key          = lower(local.regions_map_reverse[var.region])
          }

          provider "oci" {
            auth                 = "InstancePrincipal"
            region               = var.region
            tenancy_ocid         = var.tenancy_ocid
            user_ocid            = var.user_ocid
            fingerprint          = var.fingerprint
            private_key_path     = var.private_key_path
            private_key_password = var.private_key_password
            ignore_defined_tags  = ["Oracle-Tags.CreatedBy", "Oracle-Tags.CreatedOn"]
          }

          provider "oci" {
            auth                 = "InstancePrincipal"
            alias                = "home"
            region               = local.regions_map[local.home_region_key]
            tenancy_ocid         = var.tenancy_ocid
            user_ocid            = var.user_ocid
            fingerprint          = var.fingerprint
            private_key_path     = var.private_key_path
            private_key_password = var.private_key_password
            ignore_defined_tags  = ["Oracle-Tags.CreatedBy", "Oracle-Tags.CreatedOn"]
          }

          provider "oci" {
            auth                 = "InstancePrincipal"
            alias                = "secondary_region"
            region               = local.regions_map[local.home_region_key]
            tenancy_ocid         = var.tenancy_ocid
            user_ocid            = var.user_ocid
            fingerprint          = var.fingerprint
            private_key_path     = var.private_key_path
            private_key_password = var.private_key_password
            ignore_defined_tags  = ["Oracle-Tags.CreatedBy", "Oracle-Tags.CreatedOn"]
          }

          terraform {
            required_version = ">= 1.3.0"
            required_providers {
              oci = {
                source                = "oracle/oci"
                configuration_aliases = [oci.home]
              }
            }
            backend "oci" {
              bucket    = "${{ vars.OCI_TF_STATE_BUCKET }}"
              namespace = "${{ vars.OCI_TF_STATE_NAMESPACE }}"
              auth      = "InstancePrincipal"
              region    = "${{ vars.REGION }}"
              key       = "$OP04_STATE_KEY"
            }
          }
          EOF

      - name: 'Terraform Init'
        id: init
        shell: bash
        run: |
          cd "${{ github.workspace }}/ORCH"
          terraform init

      - name: 'Terraform Validate'
        id: validate
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          cd "${{ github.workspace }}/ORCH"
          terraform validate -no-color

      - name: 'Terraform Plan'
        id: plan
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/ORCH"
          SCENARIO_DIR="${{ github.workspace }}/${{ steps.target.outputs.target_subpath }}"
          mapfile -t VAR_FILES < <(find "$SCENARIO_DIR" -type f -name '*.json' | sort)

          if [ "${#VAR_FILES[@]}" -eq 0 ]; then
            echo "No JSON var-files found in $SCENARIO_DIR"
            exit 1
          fi

          VAR_ARGS=()
          for var_file in "${VAR_FILES[@]}"; do
            VAR_ARGS+=("-var-file=$var_file")
          done

          terraform plan -no-color "${VAR_ARGS[@]}" -var "output_path=output" --out tfplan.binary

      - name: 'Terraform Apply'
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/ORCH"
          SCENARIO_DIR="${{ github.workspace }}/${{ steps.target.outputs.target_subpath }}"
          mapfile -t VAR_FILES < <(find "$SCENARIO_DIR" -type f -name '*.json' | sort)

          if [ "${#VAR_FILES[@]}" -eq 0 ]; then
            echo "No JSON var-files found in $SCENARIO_DIR"
            exit 1
          fi

          VAR_ARGS=()
          for var_file in "${VAR_FILES[@]}"; do
            VAR_ARGS+=("-var-file=$var_file")
          done

          terraform apply -no-color "${VAR_ARGS[@]}" -var "output_path=output" --auto-approve

  handoff:
    name: Generate project handoff after OP04
    needs: project
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(fromJSON('["dev","test","uat","prod"]'), needs.project.outputs.target_env)
    permissions:
      contents: read
    uses: ./.github/workflows/oci-project-handoff.yaml
    with:
      project: ${{ needs.project.outputs.target_project }}
