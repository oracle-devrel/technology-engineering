name: OCI Terraform pipeline - OP02 Manage Environment

on:
  push:
    branches:
      - main
    paths:
      - 'op02_manage_environment/**'
  pull_request:
    branches:
      - main
    paths:
      - 'op02_manage_environment/**'

  workflow_dispatch:
    inputs:
      environment:
        description: Environment foundation to plan
        required: true
        type: choice
        options:
          - dev
          - test
          - uat
          - prod

jobs:
  projects:
    name: 'op02_manage_environment'
    if: vars.FOUNDATION_AUTOMATION_READY == 'true'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: 'Checkout'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: 'Resolve one environment'
      id: environment
      shell: bash
      env:
        DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.event.after }}
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          ENVIRONMENT="$DISPATCH_ENVIRONMENT"
        else
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git ls-tree -r --name-only "$AFTER_SHA")
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          fi
          mapfile -t ENVIRONMENTS < <(
            printf '%s\n' "$CHANGED_FILES" \
              | awk -F/ '$1 == "op02_manage_environment" && NF >= 3 {print $2}' \
              | sort -u
          )
          test "${#ENVIRONMENTS[@]}" -eq 1
          ENVIRONMENT="${ENVIRONMENTS[0]}"
        fi
        [[ "$ENVIRONMENT" =~ ^(dev|test|uat|prod)$ ]]
        SCENARIO="op02_manage_environment/$ENVIRONMENT"
        test -d "$SCENARIO"
        echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
        echo "SCENARIO=$SCENARIO" >> "$GITHUB_ENV"
        echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
        echo "scenario=$SCENARIO" >> "$GITHUB_OUTPUT"

    # Gather Orchestrator Module
    - name: 'Clone Orchestrator Module'
      run: git clone https://github.com/oci-landing-zones/terraform-oci-modules-orchestrator.git ORCH && git -C ORCH checkout 34202e837e9df015ddaaa4fce0ab62bb6e3883de

    # Setup Terraform Binary
    - name: 'Setup Terraform'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.12.1
        terraform_wrapper: true

    # # Setup Terraform backend overriding default Orchestrator Provider options
    - name: 'Setup Orchestrator Instance Principal Auth'
      id: backend
      run: |
        cat > ${{ github.workspace }}/ORCH/providers.tf << EOF
        data "oci_identity_regions" "these" {}

        data "oci_identity_tenancy" "this" {
          tenancy_id = var.tenancy_ocid
        }

        locals {
          regions_map         = { for r in data.oci_identity_regions.these.regions : r.key => r.name } # All regions indexed by region key.
          regions_map_reverse = { for r in data.oci_identity_regions.these.regions : r.name => r.key } # All regions indexed by region name.
          home_region_key     = data.oci_identity_tenancy.this.home_region_key                         # Home region key obtained from the tenancy data source
          region_key          = lower(local.regions_map_reverse[var.region])                           # Region key obtained from the region name
        }

        provider "oci" {
           auth                = "InstancePrincipal"
          region               = var.region
          tenancy_ocid         = var.tenancy_ocid
          user_ocid            = var.user_ocid
          fingerprint          = var.fingerprint
          private_key_path     = var.private_key_path
          private_key_password = var.private_key_password
          ignore_defined_tags  = ["Oracle-Tags.CreatedBy", "Oracle-Tags.CreatedOn"]
        }

        provider "oci" {
          auth                 = "InstancePrincipal"
          alias                = "home"
          region               = local.regions_map[local.home_region_key]
          tenancy_ocid         = var.tenancy_ocid
          user_ocid            = var.user_ocid
          fingerprint          = var.fingerprint
          private_key_path     = var.private_key_path
          private_key_password = var.private_key_password
          ignore_defined_tags  = ["Oracle-Tags.CreatedBy", "Oracle-Tags.CreatedOn"]
        }

        provider "oci" {
          auth                 = "InstancePrincipal"
          alias                = "secondary_region"
          region               = local.regions_map[local.home_region_key]
          tenancy_ocid         = var.tenancy_ocid
          user_ocid            = var.user_ocid
          fingerprint          = var.fingerprint
          private_key_path     = var.private_key_path
          private_key_password = var.private_key_password
          ignore_defined_tags  = ["Oracle-Tags.CreatedBy", "Oracle-Tags.CreatedOn"]
        }

        terraform {
          required_version = ">= 1.3.0"
          required_providers {
            oci = {
              source                = "oracle/oci"
              configuration_aliases = [oci.home]
            }
          }
            backend "oci" {
              bucket = "__BUCKET__"
              namespace ="__NAMESPACE__"
              auth = "InstancePrincipal"
              region = "__REGION__"
              key = "__SCENARIO__/terraform.tfstate"
            }
        }
        EOF
        sed -i "s|__BUCKET__|${{ vars.OCI_TF_STATE_BUCKET }}|g" ${{ github.workspace }}/ORCH/providers.tf
        sed -i "s|__NAMESPACE__|${{ vars.OCI_TF_STATE_NAMESPACE }}|g" ${{ github.workspace }}/ORCH/providers.tf
        sed -i "s|__REGION__|${{ vars.REGION }}|g" ${{ github.workspace }}/ORCH/providers.tf
        sed -i "s|__SCENARIO__|${{ env.SCENARIO }}|g" ${{ github.workspace }}/ORCH/providers.tf


    # Landing Zone Terraform Orchestrator and Base Modules initialization
    - name: 'Terraform Init'
      id: init
      run: |
       cd ${{ github.workspace }}/ORCH
       terraform init

    # Test: Terraform Validate
    - name: 'Terraform Validate'
      id: validate
      if: github.ref != 'refs/heads/main' && (success() || failure())
      run: |
       cd ${{ github.workspace }}/ORCH
       terraform validate -no-color

    # Integration: Terraform Plan
    - name: 'Terraform Plan'
      id: plan
      if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
      run: |
       cd "${{ github.workspace }}/ORCH"
       SCENARIO_DIR="${{ github.workspace }}/$SCENARIO"
       mapfile -t VAR_FILES < <(find "$SCENARIO_DIR" -type f -name '*.json' | sort)
       test "${#VAR_FILES[@]}" -gt 0
       VAR_ARGS=()
       for var_file in "${VAR_FILES[@]}"; do
         VAR_ARGS+=("-var-file=$var_file")
       done
       terraform plan -no-color "${VAR_ARGS[@]}" -var "output_path=output" --out tfplan.binary


    # Integration: Show fail status if plan failed
    - name: 'Terraform Plan Status'
      if: steps.plan.outcome == 'failure'
      run: exit 1

    # Deployment: Terraform apply when merge request
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
       cd "${{ github.workspace }}/ORCH"
       SCENARIO_DIR="${{ github.workspace }}/$SCENARIO"
       mapfile -t VAR_FILES < <(find "$SCENARIO_DIR" -type f -name '*.json' | sort)
       test "${#VAR_FILES[@]}" -gt 0
       VAR_ARGS=()
       for var_file in "${VAR_FILES[@]}"; do
         VAR_ARGS+=("-var-file=$var_file")
       done
       terraform apply -no-color "${VAR_ARGS[@]}" -var "output_path=output" --auto-approve

    - name: Generate OP02 onboarding environment artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        cd "${{ github.workspace }}/ORCH"
        terraform output -json network_resources > "${{ runner.temp }}/op02-network-resources.json"
        cd "${{ github.workspace }}"
        mapfile -t ENVIRONMENT_CONFIGS < <(
          find "$SCENARIO" -maxdepth 1 -type f -name '*.json' -print \
            | while IFS= read -r candidate; do
                jq -e '.compartments_configuration | type == "object"' "$candidate" >/dev/null 2>&1 && printf '%s\n' "$candidate"
              done
        )
        test "${#ENVIRONMENT_CONFIGS[@]}" -eq 1
        python3 scripts/render_environment_blueprint.py \
          --environment "$ENVIRONMENT" \
          --region "${{ vars.REGION }}" \
          --tenancy-ocid "${{ vars.OCI_TENANCY_OCID }}" \
          --environment-config "${ENVIRONMENT_CONFIGS[0]}" \
          --network-output "${{ runner.temp }}/op02-network-resources.json" \
          --repository "${{ github.repository }}" \
          --workflow oci-op02-terraform.yaml \
          --run-id "${{ github.run_id }}" \
          --commit-sha "${{ github.sha }}" \
          --output "${{ runner.temp }}/project-onboarding-environment.json"

    - name: Upload OP02 onboarding environment artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-artifact@v7
      with:
        name: project-onboarding-environment-${{ steps.environment.outputs.environment }}-${{ github.sha }}
        path: ${{ runner.temp }}/project-onboarding-environment.json
        if-no-files-found: error
