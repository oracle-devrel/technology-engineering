# Recovery template only. install-gitops-agent normally creates this Secret from OCI Vault.
apiVersion: v1
kind: Secret
metadata:
  name: ocir-oci-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: ocir
  enableOCI: "true"
  url: ${region_key}.ocir.io/${tenancy_namespace}/${repo_prefix}/charts
  username: "<tenancy-namespace>/<identity-domain-name>/<ocir-reader-name>"
  password: "<ocir-reader-auth-token>"
