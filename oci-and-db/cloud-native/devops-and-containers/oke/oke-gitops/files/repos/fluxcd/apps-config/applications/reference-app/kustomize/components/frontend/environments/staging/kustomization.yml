apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: reference-app
nameSuffix: -staging

resources:
  - ../../base

images:
  - name: docker.io/nginxinc/nginx-unprivileged
    newTag: 1.27.4-alpine

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: reference-app-staging
      app.kubernetes.io/environment: staging

patches:
  - path: deployment-patch.yml
