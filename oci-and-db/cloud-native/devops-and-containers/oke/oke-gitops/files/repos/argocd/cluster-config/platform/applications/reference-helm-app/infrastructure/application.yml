apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reference-helm-app-infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers: [resources-finalizer.argocd.argoproj.io]
  labels:
    app.kubernetes.io/name: reference-helm-app
    app.kubernetes.io/component: infrastructure
spec:
  project: platform
  source:
    repoURL: ${cluster_config_repo_url}
    targetRevision: HEAD
    path: platform/applications/reference-helm-app/infrastructure/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: reference-helm-app
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true, ApplyOutOfSyncOnly=true, FailOnSharedResource=true, PruneLast=true]
    automated:
      prune: true
      selfHeal: true
