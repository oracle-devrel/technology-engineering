apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet-config
  namespace: flux-system
spec:
  interval: 3m
  url: "${git_repo_url}"
  ref:
    branch: main
  secretRef:
    name: git-token-auth

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fleet-${cluster_name}
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: fleet-config
  path: ./clusters/${cluster_name}
  prune: true
  wait: true
  timeout: 5m
