apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: fleet-kube-state-metrics
  namespace: flux-system
spec:
  dependsOn:
    - apiVersion: v1
      kind: ConfigMap
      name: fleet-kube-state-metrics-values
      namespace: flux-system
  inputs:
    - valuesFrom:
        - kind: ConfigMap
          name: fleet-kube-state-metrics-values
          valuesKey: 00-base.yaml
        - kind: ConfigMap
          name: fleet-kube-state-metrics-values
          valuesKey: 90-overrides.yaml
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: kube-state-metrics

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: prometheus-community
        namespace: flux-system
      spec:
        interval: 30m
        url: https://prometheus-community.github.io/helm-charts

    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kube-state-metrics
        namespace: flux-system
      spec:
        interval: 15m
        releaseName: kube-state-metrics
        targetNamespace: kube-state-metrics
        chart:
          spec:
            chart: kube-state-metrics
            version: "8.0.0"
            sourceRef:
              kind: HelmRepository
              name: prometheus-community
        valuesFrom: << inputs.valuesFrom | toYaml | nindent 10 >>
