apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: fleet-demo
  namespace: flux-system
spec:
  dependsOn:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: fleet-config
      namespace: flux-system
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: fleet-demo

    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: fleet-demo
        namespace: flux-system
      spec:
        interval: 5m
        sourceRef:
          kind: GitRepository
          name: fleet-config
        path: ./profiles/common/applications/fleet-demo/resources
        targetNamespace: fleet-demo
        prune: true
        wait: true
        timeout: 3m
