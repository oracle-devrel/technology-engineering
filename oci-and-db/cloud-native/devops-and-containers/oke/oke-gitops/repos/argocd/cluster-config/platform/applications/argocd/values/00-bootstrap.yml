# Resource Manager replaces these placeholders when it first seeds the
# cluster-config repository. Keep this file first in the ordered valueFiles.
global:
  image:
    repository: ${region_key}.ocir.io/${tenancy_namespace}/${repo_prefix}/argocd
  imagePullSecrets:
    - name: ocirsecret

dex:
  image:
    repository: ${region_key}.ocir.io/${tenancy_namespace}/${repo_prefix}/dex

redis:
  image:
    repository: ${region_key}.ocir.io/${tenancy_namespace}/${repo_prefix}/redis

# Required by parent/child sync waves so the parent waits for child health.
configs:
  cm:
    admin.enabled: "true"
    users.anonymous.enabled: "false"
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for child Application status"
      if obj.status == nil then
        return hs
      end
      local syncStatus = "Unknown"
      if obj.status.sync ~= nil and obj.status.sync.status ~= nil then
        syncStatus = obj.status.sync.status
      end
      local healthStatus = "Progressing"
      local healthMessage = ""
      if obj.status.health ~= nil then
        if obj.status.health.status ~= nil then
          healthStatus = obj.status.health.status
        end
        if obj.status.health.message ~= nil then
          healthMessage = obj.status.health.message
        end
      end
      if healthStatus == "Degraded" or healthStatus == "Missing" then
        hs.status = healthStatus
        hs.message = healthMessage
        return hs
      end
      if syncStatus ~= "Synced" then
        hs.status = "Progressing"
        hs.message = "Waiting for child Application to become Synced (currently " .. syncStatus .. ")"
        return hs
      end
      hs.status = healthStatus
      hs.message = healthMessage
      return hs
  params:
    server.insecure: false
  rbac:
    policy.default: role:readonly

server:
  service:
    type: ClusterIP
